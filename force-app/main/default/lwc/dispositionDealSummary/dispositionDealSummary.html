<template>
    <!--
        RESTYLED 2026-08-21 TO MATCH `c/dealDocStatus` ON THE OPPORTUNITY PAGE: `lightning-card`
        with the `standard:document` icon, a tinted round icon chip per document type, the row
        name as a click-through link, and a soft-tinted status pill.
        🔴 THREE THINGS ARE DELIBERATELY NOT COPIED FROM IT — the third row state below, the
        absence of inline `style` colours, and the real `href` on the anchor. The component's JS
        header argues each one; read it before "harmonising" this template with dealDocStatus's.
    -->
    <lightning-card icon-name="standard:document">
        <span slot="title" class="card-title">Deal Summary</span>

        <div class="body">
            <p class="card-sub">NDA, LOI and PSA status for this sale</p>

            <!--
                THE ERROR BRANCH IS THE WHOLE-CARD ONE, AND IT IS REACHED ONLY WHEN THE CONTROLLER
                ITSELF THROWS. A permission gap on NDA / LOI / Contract Review degrades a single ROW
                (see the `unavailable` branch below) because this card is ungated and renders on all
                11 disposition stages — a whole-card banner would be a permanent fixture.
            -->
            <template lwc:if={hasError}>
                <div class="error-line" role="alert">{loadError}</div>
            </template>

            <template lwc:elseif={hasSummary}>
                <!--
                    🔴 THE SALE'S SUBJECT, AS CONTEXT — AND SINCE 2026-08-24 IT WEARS THE SAME ROW
                    TREATMENT AS THE THREE DOCUMENT ROWS BELOW. Icon chip, bold label, right-aligned
                    pill: the `.row-head` / `.row-left` / `.row-icon` / `.row-label` / `.pill`
                    composition is REUSED VERBATIM, not approximated, so it reads as the first line
                    of one stack rather than a bare sentence bolted above one. The JS getter argues
                    the slot assignment (label "Property", pill = the asset NAME) at length.

                    🔴 IT IS STILL NOT ONE OF THE `<ul>`'s ITEMS, AND THE OUTER HOOK IS
                    `.asset-row`, NOT `.row`. Two separate reasons, both load-bearing:
                      1. The list is named "Deal documents"; a property is not one, and putting it
                         inside would make that accessible name a lie.
                      2. `.row` / `[data-row]` / `[data-pill]` / `[data-icon]` are what the suite
                         counts to prove there are exactly THREE document rows. Reusing those hooks
                         here would inflate every one of those counts to four and quietly turn a
                         set of real pins into noise. `.asset-row` shares `.row`'s box by sharing
                         its declaration block in the stylesheet — one source of truth, no copy.

                    Absent (or off-stage — see below) renders NOTHING: no placeholder, no em-dash,
                    no dead link. That is the opposite of the three rows below, where an empty state
                    is itself the information.

                    🔴 `showPropertyRow` IS STAGE-GATED (`Disposition_Stage__c = 'Closing'`) AND
                    FAILS CLOSED. The stage arrives on a SECOND wire (`getRecord`), so for the first
                    tick after the card's own wire lands the stage is still unknown — and unknown
                    renders nothing, so the row can never flash in and be pulled back out.

                    The `<a>` carries a REAL `href` from NavigationMixin.GenerateUrl — that is
                    what makes it keyboard-focusable and announced as a link — with
                    `preventDefault()` in the shared handler so an in-app click stays a SPA
                    transition. `handleOpenRecord` is REUSED VERBATIM: it reads
                    `data-record-id` off `currentTarget`, which is exactly what this anchor
                    carries, so the asset needs no second navigation path to drift from the
                    rows’.
                -->
                <template lwc:if={showPropertyRow}>
                    <div class="asset-row" data-asset-line>
                        <div class="row-head">
                            <span class="row-left">
                                <!--
                                    Decorative, exactly like the three document chips: the visible
                                    "Property" label beside it already carries the meaning, and an
                                    alternative-text here made a screen reader announce it twice.
                                -->
                                <span class="row-icon row-icon_property" data-asset-icon>
                                    <lightning-icon
                                        icon-name="utility:company"
                                        size="x-small"
                                        alternative-text=""
                                    ></lightning-icon>
                                </span>

                                <template lwc:if={assetLink.hasLink}>
                                    <a
                                        class="row-label row-label_link"
                                        data-asset-label
                                        data-asset-link
                                        data-record-id={assetLink.recordId}
                                        href={assetLink.url}
                                        title={assetLink.title}
                                        onclick={handleOpenRecord}
                                        >Property</a
                                    >
                                </template>
                                <template lwc:else>
                                    <span class="row-label row-label_muted" data-asset-label
                                        >Property</span
                                    >
                                </template>
                            </span>
                            <!--
                                THE PILL SLOT CARRIES THE ASSET NAME. On a document row the pill is
                                the row's current VALUE (a status); a property's only value is which
                                property it is. `pill_neutral` is the one tone on this card that
                                asserts nothing — every other tone would read as a status the asset
                                does not have. `pill_asset` adds the truncation defence `.row-label`
                                already has, because a name is unbounded and a pill is `nowrap`.
                            -->
                            <span class="pill pill_neutral pill_asset" data-asset-pill
                                >{assetLink.name}</span
                            >
                        </div>
                    </div>
                </template>
                <!--
                    `role="list"` is NOT redundant next to `<ul>`: `list-style: none` makes WebKit
                    drop the implicit role, and `aria-label` is only exposed on a role that supports
                    naming. axe has no rule for this, so a green `toBeAccessible()` is not evidence
                    against it.
                -->
                <ul class="rows" role="list" aria-label="Deal documents">
                    <template for:each={rows} for:item="row">
                        <li key={row.key} class="row" data-row={row.key}>
                            <div class="row-head">
                                <span class="row-left">
                                    <!--
                                        The chip's colour comes from the STYLESHEET via
                                        `--slds-c-icon-color-foreground-default` set on this span —
                                        custom properties inherit across the shadow boundary into
                                        lightning-icon's own root. dealDocStatus sets a hard-coded
                                        hex inline on every icon; ARCHITECTURE.md §5 forbids that
                                        and this bundle lints at zero violations.
                                        ⚠ `alternative-text=""` is deliberate: the icon is
                                        DECORATIVE. The visible `{row.label}` beside it already
                                        carries the meaning, and passing the label here made a
                                        screen reader announce "NDA NDA".
                                    -->
                                    <span class={row.iconClass} data-icon={row.key}>
                                        <lightning-icon
                                            icon-name={row.iconName}
                                            size="x-small"
                                            alternative-text=""
                                        ></lightning-icon>
                                    </span>

                                    <!--
                                        🔴 A LINK ONLY WHEN THERE IS SOMETHING TO OPEN. `hasLink` is
                                        false for BOTH an empty row (no record) and a degraded one
                                        (no Id — the service leaves it null when the read threw), so
                                        neither can offer a link to a record the reader was refused
                                        or that does not exist. The `href` is real, generated by
                                        NavigationMixin.GenerateUrl, which is what makes the anchor
                                        keyboard-focusable — dealDocStatus's href-less `<a onclick>`
                                        is not.
                                    -->
                                    <template lwc:if={row.hasLink}>
                                        <a
                                            class="row-label row-label_link"
                                            data-label={row.key}
                                            data-record-id={row.recordIdForLink}
                                            href={row.recordUrl}
                                            title={row.linkTitle}
                                            onclick={handleOpenRecord}
                                            >{row.label}</a
                                        >
                                    </template>
                                    <template lwc:else>
                                        <span class="row-label row-label_muted" data-label={row.key}
                                            >{row.label}</span
                                        >
                                    </template>
                                </span>
                                <span class={row.pillClass} data-pill={row.key}>{row.statusLabel}</span>
                            </div>

                            <template for:each={row.metaLines} for:item="line">
                                <p key={line.key} class="row-meta" data-meta={line.key}>{line.text}</p>
                            </template>

                            <!--
                                One hint slot, two meanings, styled apart on purpose: an EMPTY row
                                says "No LOI on this sale yet" (a fact about the sale) and a DEGRADED
                                row says the data is not readable (a fact about the reader's access).
                                Collapsing the two is what hid a live provisioning gap behind the BOV
                                NDA pill — design §0 C-1.
                            -->
                            <template lwc:if={row.hintText}>
                                <p class={row.hintClass} data-hint={row.key}>{row.hintText}</p>
                            </template>
                        </li>
                    </template>
                </ul>
            </template>
        </div>
    </lightning-card>
</template>
