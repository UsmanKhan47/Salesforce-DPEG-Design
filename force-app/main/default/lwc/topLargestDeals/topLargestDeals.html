<template>
    <lightning-card icon-name="standard:opportunity">
        <span slot="title">Top 5 Largest Deals ({count})</span>

        <template if:true={hasError}>
            <div class="lv-error slds-p-around_medium slds-text-color_error" role="alert">{errorMessage}</div>
        </template>

        <template if:false={hasError}>
            <c-list-datatable
                key-field="id"
                data={rows}
                columns={columns}
                hide-checkbox-column>
            </c-list-datatable>
        </template>

        <div slot="footer" class="view-all-footer">
            <a href={listUrl} onclick={viewAll}>View All</a>
        </div>
    </lightning-card>
</template>
