<template>
    <div class="card">
        <div class="section-header">Disposition Offers</div>
        <template if:true={hasOffers}>
            <div class="offer-list">
                <template for:each={offers} for:item="o">
                    <div key={o.id} class="offer-row">
                        <div class="offer-buyer">{o.buyerName}</div>
                        <div class="offer-amount">{o.amountLabel}</div>
                        <div class="offer-date">{o.dateLabel}</div>
                    </div>
                </template>
            </div>
        </template>
        <template if:true={hasError}>
            <div class="wire-error" role="alert">
                <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
                <span>Offers could not be loaded: {errorMessage}</span>
            </div>
        </template>
        <template if:true={showEmpty}>
            <!--
              The 60-day marketing clock with a 30-day traction checkpoint (D27.1 / D28-Q2).
              This string used to read "6-week clock active", which contradicted the document
              and — after Tranche 5B — would have contradicted the traction panel on the same
              screen. The numbers are stated once more here only because this component has no
              server payload of its own; DispositionTractionService remains the single source
              for every DECISION made from them.
            -->
            <div class="empty-msg">
                No offers yet. 60-day marketing clock, traction check at day 30.
            </div>
        </template>
        <div class="log-btn-wrap">
            <button class="log-btn" onclick={handleLogOffer}>+ Log Offer</button>
        </div>
    </div>
</template>
