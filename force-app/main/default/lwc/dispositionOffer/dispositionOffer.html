<template>
    <div class="card">
        <!--
          ⚠ THE TITLE IS DERIVED, NOT LITERAL (2026-08-24). It reads "Disposition Offers" in
          the default mode and "Selected Offer" in `selected-only` mode. See `cardTitle` in the
          JS for why the selected-mode title is not "Offer Sent for Approval".

          ⚠ THE DEFAULT STRING IS REFERENCED BY ANOTHER COMPONENT'S COPY. The Select Offer
          screen (`c/dispositionOfferSelect`) tells the user to "Log an offer from the
          **Disposition Offers** card first". That copy renders only when the disposition has
          NO offers, which is a state `selected-only` mode can never be in (Offer Selection is
          only reachable through a selection, which needs an offer), so the two cannot disagree.
          Do not rename the DEFAULT title without changing that sentence too.
        -->
        <div class="section-header">{cardTitle}</div>
        <template if:true={hasOffers}>
            <div class="offer-list">
                <template for:each={offers} for:item="o">
                    <div key={o.id} class="offer-row">
                        <!-- 🔴 THE OFFER NUMBER, NOT A BUYER NAME. Buyer identity was retired
                             on 2026-08-21; see the JS header before putting a party back in
                             this column, and note that the BROKER is the same on every row.

                             ⚠ THE NUMBER IS A LINK TO THE OFFER RECORD, IN **BOTH** MODES
                             (2026-08-25). Opening a record is not a stage-specific privilege,
                             and this loop is the single row template both modes render — a
                             mode-gated link would have meant a second row shape to keep in
                             step for no gain.

                             🔴 A REAL `href` FROM `NavigationMixin.GenerateUrl`, NOT A
                             HAND-BUILT `/lightning/r/...` STRING, WITH `preventDefault()` +
                             `Navigate` IN THE HANDLER. The href is what makes the anchor
                             keyboard-focusable, announced as a link, and middle-clickable /
                             open-in-new-tab; the handler is what keeps a plain left-click an
                             in-app SPA transition instead of a full page load. This is the
                             `c/dispositionDealSummary` row-label shape verbatim.

                             🔴 `hasLink` EXISTS BECAUSE `GenerateUrl` IS ASYNCHRONOUS. For the
                             tick between the wire landing and the promise settling there is no
                             URL, and a bound attribute is written UNCONDITIONALLY by the LWC
                             compiler — `href={o.recordUrl}` with an unresolved URL would put
                             the literal string "undefined" in the href (measured in this repo).
                             Until then, and if the promise rejects, the row renders the same
                             plain text it always did. Never a bare `<a>` with no destination. -->
                        <div class="offer-name">
                            <template lwc:if={o.hasLink}>
                                <a
                                    class="offer-link"
                                    data-record-id={o.id}
                                    href={o.recordUrl}
                                    title={o.linkTitle}
                                    onclick={handleOpenOffer}
                                    >{o.offerName}</a
                                >
                            </template>
                            <template lwc:else>{o.offerName}</template>
                        </div>
                        <div class="offer-amount">{o.amountLabel}</div>
                        <div class="offer-date">{o.dateLabel}</div>
                    </div>
                </template>
            </div>
        </template>
        <template if:true={hasError}>
            <div class="wire-error" role="alert">
                <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
                <span>Offers could not be loaded: {errorMessage}</span>
            </div>
        </template>
        <template if:true={showEmpty}>
            <!--
              ⚠ THE CLOCK NOTE THAT USED TO FOLLOW "No offers yet." WAS REMOVED AT UAT ON
              2026-08-21 ("we don't need listing traction"), and it was ALSO WRONG by then: it
              read "60-day marketing clock, traction check at day 30" while
              DispositionTractionService had moved to 42 days with rungs at 7/28/42. It was the
              last hardcoded copy of the ladder in any LWC, and this component has no server
              payload of its own to correct it from. 🔴 DO NOT REINSTATE A NUMBER HERE. The
              schedule renders once, on c/listingAlerts, from the server.

              ⚠ THE STRING IS MODE-DEPENDENT (2026-08-24). In `selected-only` mode "No offers
              yet." would be a LIE — there are offers, none of them flagged. See `emptyMessage`.
            -->
            <div class="empty-msg">{emptyMessage}</div>
        </template>
        <!--
          🔴 HIDDEN IN `selected-only` MODE — NOT DISABLED (user decision, 2026-08-25). This
          REVERSES the 2026-08-24 decision one day old; the button was rendered greyed with an
          explanatory `title` until now. The reasoning that argued for disabled-not-hidden ("a
          vanished control reads as a permission problem") is retired, not merely reworded, and
          the tooltip that carried it is gone with it — see `showLogButton` in the JS.

          ⚠ THE ONLY REMAINING BOUND ATTRIBUTE IS `title`, AND IT IS NOW A CONSTANT. A getter
          bound to an attribute is written UNCONDITIONALLY by the LWC compiler, so a `logTitle`
          returning `undefined` would render the literal `title="undefined"` on the page
          (measured in this repo). `logTitle` therefore still always returns a non-empty string.

          🔴 STILL **TWO** GUARDS, JUST A DIFFERENT FIRST ONE. `lwc:if` replaces the `disabled`
          binding as the guard the user SEES; `handleLogOffer` keeps its own early return for
          the same mode as belt and braces, so dropping either one alone still leaves the
          feature correct rather than silently opening the save path.
        -->
        <template lwc:if={showLogButton}>
            <div class="log-btn-wrap">
                <button
                    class="log-btn"
                    onclick={handleLogOffer}
                    title={logTitle}
                >+ Log Offer</button>
            </div>
        </template>
    </div>
</template>
