<template>
    <div class="card">
        <!--
          ⚠ THE TITLE IS DERIVED, NOT LITERAL (2026-08-24). It reads "Disposition Offers" in
          the default mode and "Selected Offer" in `selected-only` mode. See `cardTitle` in the
          JS for why the selected-mode title is not "Offer Sent for Approval".

          ⚠ THE DEFAULT STRING IS REFERENCED BY ANOTHER COMPONENT'S COPY. The Select Offer
          screen (`c/dispositionOfferSelect`) tells the user to "Log an offer from the
          **Disposition Offers** card first". That copy renders only when the disposition has
          NO offers, which is a state `selected-only` mode can never be in (Offer Selection is
          only reachable through a selection, which needs an offer), so the two cannot disagree.
          Do not rename the DEFAULT title without changing that sentence too.
        -->
        <div class="section-header">{cardTitle}</div>
        <template if:true={hasOffers}>
            <div class="offer-list">
                <template for:each={offers} for:item="o">
                    <div key={o.id} class="offer-row">
                        <!-- 🔴 THE OFFER NUMBER, NOT A BUYER NAME. Buyer identity was retired
                             on 2026-08-21; see the JS header before putting a party back in
                             this column, and note that the BROKER is the same on every row. -->
                        <div class="offer-name">{o.offerName}</div>
                        <div class="offer-amount">{o.amountLabel}</div>
                        <div class="offer-date">{o.dateLabel}</div>
                    </div>
                </template>
            </div>
        </template>
        <template if:true={hasError}>
            <div class="wire-error" role="alert">
                <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
                <span>Offers could not be loaded: {errorMessage}</span>
            </div>
        </template>
        <template if:true={showEmpty}>
            <!--
              ⚠ THE CLOCK NOTE THAT USED TO FOLLOW "No offers yet." WAS REMOVED AT UAT ON
              2026-08-21 ("we don't need listing traction"), and it was ALSO WRONG by then: it
              read "60-day marketing clock, traction check at day 30" while
              DispositionTractionService had moved to 42 days with rungs at 7/28/42. It was the
              last hardcoded copy of the ladder in any LWC, and this component has no server
              payload of its own to correct it from. 🔴 DO NOT REINSTATE A NUMBER HERE. The
              schedule renders once, on c/listingAlerts, from the server.

              ⚠ THE STRING IS MODE-DEPENDENT (2026-08-24). In `selected-only` mode "No offers
              yet." would be a LIE — there are offers, none of them flagged. See `emptyMessage`.
            -->
            <div class="empty-msg">{emptyMessage}</div>
        </template>
        <!--
          ⚠ `disabled` AND `title` ARE BOTH BOUND, AND BOTH RESOLVE IN EVERY MODE. A getter
          bound to an attribute is written UNCONDITIONALLY by the LWC compiler, so a `logTitle`
          that returned `undefined` in the enabled state would render the literal
          `title="undefined"` on the page (measured in this repo). `logTitle` therefore always
          returns a non-empty string.

          🔴 THE `disabled` BINDING IS ONE OF **TWO** GUARDS, DELIBERATELY. `handleLogOffer`
          returns early in the same mode. Removing either one alone leaves the feature correct
          and reds exactly one test — which is the point: neither test can go vacuous behind
          the other.
        -->
        <div class="log-btn-wrap">
            <button
                class="log-btn"
                onclick={handleLogOffer}
                disabled={logDisabled}
                title={logTitle}
            >+ Log Offer</button>
        </div>
    </div>
</template>
