<template>
    <template if:true={listing}>
        <div class="card">
            <div class="card-header">
                <div class="header-left">
                    <div class="card-title">{listing.assetName}</div>
                    <div class="card-sub">{listing.brokerFirm} · {listing.contactName}</div>
                </div>
                <!--
                    The escalation label and the Replace Broker button sit together, beside the
                    listing facts, because the label is the reason anyone presses the button. The
                    label is TEXT (never a colour-only dot) and the button is a real <button> with
                    a visible name, not an icon.
                -->
                <div class="header-right">
                    <template if:true={hasTractionLabel}>
                        <span class="risk-badge" title={listing.tractionDetail}><span class="risk-dot"></span>{listing.tractionLabel}</span>
                    </template>
                    <template if:true={canReplaceBroker}>
                        <button
                            type="button"
                            class="replace-btn"
                            onclick={handleReplaceBroker}
                        >Replace Broker</button>
                    </template>
                </div>
            </div>
            <div class="cards-grid">
                <template for:each={stats} for:item="stat">
                    <c-onboarding-card-child
                        key={stat.key}
                        value={stat.value}
                        label={stat.label}
                        icon-name={stat.iconName}
                        icon-color={stat.iconColor}>
                    </c-onboarding-card-child>
                </template>
            </div>
        </div>
    </template>
    <template if:true={error}>
        <div class="empty-card bl-error slds-text-color_error">Broker listing could not be loaded: {errorMessage}</div>
    </template>
    <template if:true={showEmpty}>
        <div class="empty-card">No broker listing on record.</div>
    </template>
</template>
