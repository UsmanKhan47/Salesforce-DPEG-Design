<template>
    <template if:true={listing}>
        <div class="card">
            <div class="card-header">
                <div class="header-left">
                    <div class="card-title">{listing.assetName}</div>
                    <div class="card-sub">{listing.brokerFirm} · {listing.contactName}</div>
                </div>
                <!--
                    The escalation label and the Replace Broker button sit together, beside the
                    listing facts, because the label is the reason anyone presses the button. The
                    label is TEXT (never a colour-only dot) and the button is a real <button> with
                    a visible name, not an icon.
                -->
                <div class="header-right">
                    <template if:true={hasTractionLabel}>
                        <span class="risk-badge" title={listing.tractionDetail}><span class="risk-dot"></span>{listing.tractionLabel}</span>
                    </template>
                    <template if:true={canReplaceBroker}>
                        <button
                            type="button"
                            class="replace-btn"
                            onclick={handleReplaceBroker}
                        >Replace Broker</button>
                    </template>
                </div>
            </div>
            <div class="cards-grid">
                <template for:each={stats} for:item="stat">
                    <c-onboarding-card-child
                        key={stat.key}
                        value={stat.value}
                        label={stat.label}
                        icon-name={stat.iconName}
                        icon-color={stat.iconColor}>
                    </c-onboarding-card-child>
                </template>
            </div>

            <!--
                ── THE RULE ──────────────────────────────────────────────────────────────────
                A token-driven hairline, NOT a hardcoded border colour: `--slds-g-color-border-1`
                is `light-dark(#c9c9c9, #444)` under SLDS 2, so it inverts with the theme where a
                literal `#eef1f4` would stay pale grey and vanish on a dark surface. It is a
                one-pixel BOX rather than a `border-top`, because a border on the section below
                would collapse against the grid's own padding at some widths.

                ⚠ IT IS `role="presentation"` AND CARRIES NO TEXT. It divides visually only; the
                section heading beneath it is what tells a screen reader a new group has started.
            -->
            <div class="cfo-rule" role="presentation"></div>

            <div class="cfo-section">
                <!--
                    ⚠ A HEADING, NOT DECORATION. Without it the third tile's label reads a bare
                    "Status" and could be mistaken for the status of the LISTING — which is what
                    the traction pill at the top of this card already reports. The heading is what
                    scopes all three tiles to the call for offers.

                    ⚠ NOT AN `<h3>`. This card's own title (`.card-title`) is a `<div>`, so an
                    `<h3>` here would be the first and only heading in the bundle and would sit
                    UNDER a non-heading title — axe's heading-order/one-main-heading family reads
                    that as a broken outline. The grouping is expressed by `.cfo-section` instead.
                -->
                <div class="cfo-heading">Call for Offers</div>

                <!--
                    ⚠ `auto-fit` + `minmax`, NOT `repeat(3, 1fr)`. This card renders in the `main`
                    region today, but nothing pins it there, and three tiles across a narrow column
                    truncate every value at once. The tiles reflow to 2-up then 1-up on their own.

                    🔴 THE `gap` IS LOAD-BEARING MARKUP, not spacing polish. The LWC template
                    compiler DISCARDS the whitespace between sibling elements, so with `gap`
                    removed these tiles butt directly against each other with nothing between
                    them — and the same is true of the value/label pair inside each tile. Measured
                    on three separate bundles in this repo. Do not "simplify" it away.
                -->
                <div class="cfo-grid">
                    <div class="cfo-tile">
                        <lightning-icon
                            class="cfo-tile-icon cfo-tile-icon_date"
                            icon-name="utility:event"
                            size="small"
                            alternative-text="">
                        </lightning-icon>
                        <div class="cfo-tile-text">
                            <span class="cfo-tile-value" title={cfoDateLabel}>{cfoDateLabel}</span>
                            <span class="cfo-tile-label">Call For Offers Date</span>
                        </div>
                    </div>

                    <div class="cfo-tile">
                        <lightning-icon
                            class="cfo-tile-icon cfo-tile-icon_countdown"
                            icon-name="utility:clock"
                            size="small"
                            alternative-text="">
                        </lightning-icon>
                        <div class="cfo-tile-text">
                            <!--
                                🔴 THIS IS THE TILE THAT MUST NOT LIE WHEN THE DATE IS BLANK — which
                                is every live disposition in the org right now. It renders an em dash
                                there, never `0` ("due today") and never a negative number. See
                                `_cfoState` for why `0` and `null` cannot be collapsed.
                            -->
                            <span class="cfo-tile-value" title={cfoCountdownLabel}>{cfoCountdownLabel}</span>
                            <!--
                                ⚠ "DAYS REMAINING", NOT "Days to Call for Offers" (renamed at UAT
                                2026-08-25). The section heading two rows up already says "Call for
                                Offers", so the old label repeated it and pushed the tile to two
                                lines at the narrow widths this grid is built to reflow into. The
                                VALUE logic is unchanged — `14 days` / `Today` / `5 days ago` / `—`.
                            -->
                            <span class="cfo-tile-label">Days Remaining</span>
                        </div>
                    </div>

                    <div class="cfo-tile">
                        <!--
                            🔴 THIS TILE WAS A PILL UNTIL 2026-08-25 AND IS DELIBERATELY NOT ONE NOW.
                            A small outlined badge sitting where its two siblings put a bold value
                            read as a floating fragment above an orphaned "STATUS" label, beside an
                            icon slot that carried no state. The tile now has the SAME ANATOMY as the
                            two beside it — state icon, bold value, label — and the state is carried
                            by the icon GLYPH and the WORD, with colour as reinforcement only.

                            ⚠ THE ICON IS STATEFUL, so `icon-name` is bound, not literal. It was a
                            fixed `utility:flag`, which said nothing the label did not.
                            ⚠ `alternative-text=""` ON PURPOSE: the icon duplicates the word
                            immediately to its right, so naming it makes a screen reader say the
                            state twice. Both sibling tiles are decorative for the same reason.

                            ⚠ THE HEADER PILL AT THE TOP OF THIS CARD ("Day 0 of 42 — On Track") IS
                            A DIFFERENT ELEMENT and stays a pill. Do not "unify" the two.
                        -->
                        <lightning-icon
                            class={cfoStatusIconClass}
                            icon-name={cfoStatusIconName}
                            size="small"
                            alternative-text="">
                        </lightning-icon>
                        <div class="cfo-tile-text">
                            <span class={cfoStatusValueClass} title={cfoStatusLabel}>{cfoStatusLabel}</span>
                            <span class="cfo-tile-label">Status</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <template if:true={error}>
        <div class="empty-card bl-error slds-text-color_error">Broker listing could not be loaded: {errorMessage}</div>
    </template>
    <template if:true={showEmpty}>
        <div class="empty-card">No broker listing on record.</div>
    </template>
</template>
