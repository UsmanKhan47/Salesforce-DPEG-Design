<template>
    <div class="card">
        <div class="section-header">Backup Brokers</div>
        <div class="broker-list">
            <template for:each={rows} for:item="r">
                <div key={r.id} class="broker-row">
                    <lightning-icon icon-name="utility:user" size="x-small" class="broker-icon"></lightning-icon>
                    <div class="broker-info">
                        <!-- Contact first and emphasised; firm muted beneath.
                             `primaryName` already falls back to the firm (and
                             then to a literal) when the contact is null, so
                             this line never renders an em dash on its own. -->
                        <div class="broker-name"><strong>{r.primaryName}</strong></div>
                        <!-- Emitted only when the firm is not already the
                             primary line — no empty node, no dangling separator. -->
                        <template lwc:if={r.firmLabel}>
                            <div class="broker-meta broker-firm">{r.firmLabel}</div>
                        </template>
                        <div class="broker-meta">Score {r.bovScore} · {r.bovAmountLabel}</div>
                    </div>
                </div>
            </template>
            <template if:true={loadError}>
                <div class="empty-msg error-msg" role="alert">{loadError}</div>
            </template>
            <template if:true={isEmpty}>
                <div class="empty-msg">No backup brokers.</div>
            </template>
        </div>
    </div>
</template>
