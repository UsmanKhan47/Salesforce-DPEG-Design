<template>
    <lightning-modal-header label="Log Offer"></lightning-modal-header>

    <lightning-modal-body>
        <div class="lom-body slds-is-relative">
            <template lwc:if={isBusy}>
                <lightning-spinner
                    alternative-text="Loading the offer form"
                    size="small"
                ></lightning-spinner>
            </template>

            <!-- ═══════════════════════════════════════════════════════════════════════════
                 THE LOAD FAILED. Distinct from the refusal panel below, because the remedies
                 are different people: this one is an administrator, that one is the analyst.
                 ═══════════════════════════════════════════════════════════════════════════ -->
            <template lwc:if={hasLoadError}>
                <div class="lom-error" role="alert">{loadErrorMessage}</div>
            </template>

            <!-- ═══════════════════════════════════════════════════════════════════════════
                 🔴 THE REFUSAL PANEL. NO FORM IS RENDERED AT ALL — THIS IS THE POINT.
                 ═══════════════════════════════════════════════════════════════════════════
                 🔴 ITS SUBJECT CHANGED ON 2026-08-21, FROM THE BUYER TO THE BROKER.
                 It used to read "No buyer available", because `Buyer_Required_On_Offer`
                 made a buyer-less save literally impossible. The buyer picker is gone, so
                 that refusal is gone with it — and a dialog with NO refusal path at all was
                 not an option, because with the buyer removed `Broker__c` is the only party
                 an offer names. An offer naming nobody cannot be attributed, cannot be told
                 apart from another offer on the same sale, and is what
                 `DispositionApprovalService.selectOffer` would be choosing between.

                 ⚠ THIS REFUSAL IS A DESIGN DECISION, NOT A PLATFORM CONSTRAINT, AND THE
                 DIFFERENCE MATTERS TO WHOEVER READS THIS NEXT. Nothing stops a broker-less
                 offer saving — the six active validation rules on `Disposition_Offer__c`
                 were enumerated in `usman-dpeg` on 2026-08-21 and none of them names the
                 broker. The cost is real: an offer that arrives before the broker is
                 appointed can no longer be logged here, and this dialog is the only entry
                 point. Reversing it is one getter (`canSave` in the JS).

                 ⚠ THE COPY IS SHORT ON PURPOSE, AND THE REASON IS MEASURED. The previous
                 panel was factually correct in five sentences and the user read the first
                 one, concluded the dialog was wrong, and stopped. Cause first, remedy
                 second, nothing else. The remedy line is per record type because the two
                 remedies are on two different screens. DO NOT ADD A THIRD SENTENCE
                 EXPLAINING WHY AN OFFER NEEDS A BROKER — that reasoning is above, for
                 developers, which is who needs it. -->
            <template lwc:elseif={showEmptyState}>
                <div class="lom-empty">
                    <h2 class="lom-empty-heading">No broker appointed</h2>
                    <!-- ⚠ AN INLINE ELEMENT MUST NOT START A LINE. The LWC template compiler
                         drops the trailing whitespace of a text node that ends a line before an
                         element, so breaking before a <strong> renders two words joined —
                         measured in this repo, and caught by the Jest assertion on RENDERED
                         text rather than on source. This copy is plain text precisely so the
                         trap cannot fire; keep it that way. -->
                    <p class="lom-empty-copy lom-empty-next">
                        No broker is appointed on this sale yet. {brokerEmptyHint}
                    </p>
                </div>
            </template>

            <!-- ═══════════════════════════════════════════════════════════════════════════
                 THE FORM. Rendered only when a broker has resolved.
                 🔴 NO `record-id`: this form ONLY EVER CREATES. In create mode
                 `lightning-record-edit-form` enforces CRUD/FLS for the running user and
                 surfaces validation-rule refusals through <lightning-messages>, which is why
                 this component needs no Apex on the WRITE side at all.

                 🔴 THE BRANCH IS `lwc:elseif={canSave}`, NOT `lwc:else`, AND THE DIFFERENCE IS
                 THE PRE-ANSWER FRAME. `canSave` is false until the wire has answered, so an
                 `lwc:else` here would render the whole form underneath the loading spinner on
                 every open. Measured, not theorised: the first version of this template used
                 `lwc:else` and the rendered HTML before the wire answered contained the form.
                 ⚠ There is deliberately NO `lwc:else` on this chain at all. While loading, the
                 body renders nothing but the spinner — the honest state.
                 ═══════════════════════════════════════════════════════════════════════════ -->
            <template lwc:elseif={canSave}>
                <lightning-record-edit-form
                    class="lom-form"
                    object-api-name="Disposition_Offer__c"
                    onsubmit={handleSubmit}
                    onsuccess={handleSuccess}
                    onerror={handleError}
                >
                    <!-- ⚠ THE PLATFORM'S OWN ERROR SURFACE, NOT A HAND-ROLLED BANNER. Six
                         validation rules are active on this object and every one carries an
                         AUTHORED message naming the field it is about. <lightning-messages>
                         renders those against the right field; hand-parsing
                         `error.detail.output.fieldErrors` to rebuild the same thing is how the
                         attribution gets lost.
                         🔴 ONE OF THOSE SIX IS `Buyer_Required_On_Offer`, WHICH THIS FORM CAN
                         NO LONGER SATISFY — see the ship-blocker note in the JS header. Until
                         it is deactivated, this element is where every save lands. -->
                    <lightning-messages></lightning-messages>

                    <!-- 🔴 NO INTRO PARAGRAPH ABOVE THIS FORM. `.lom-intro` ("Log an offer against
                         this sale. It is saved here on the disposition — you stay on this page and
                         the offers card refreshes behind this dialog.") was removed on 2026-08-21
                         at the user's request: it restated the dialog's own title and the Save
                         button's behaviour. The REFUSAL panel above is a different thing and was
                         explicitly kept — it is the only surface explaining a dialog that renders
                         no form at all. -->
                    <div class="lom-grid">
                        <!-- ═══════════════════════════════════════════════════════════════
                             THE PARENT. Shown so the analyst can see what they are logging
                             against, and DISABLED so a dialog opened on one sale cannot log
                             an offer against another.
                             🔴 ITS VALUE IS ALSO FORCED IN JS ON BOTH SUBMIT PATHS. A
                             disabled control is conventionally excluded from a form
                             submission, so this input is a DISPLAY, not the transport.
                             ═══════════════════════════════════════════════════════════════ -->
                        <lightning-input-field
                            class="lom-field lom-field-disposition lom-field_full"
                            field-name="Disposition__c"
                            value={dispositionId}
                            disabled
                        ></lightning-input-field>

                        <!-- ═══════════════════════════════════════════════════════════════
                             🔴 THE BROKER — DISPLAY ONLY, AND NOT AN INPUT OF ANY KIND.
                             ═══════════════════════════════════════════════════════════════
                             Resolved server-side per record type: on-market from the SELECTED
                             `BOV_Submission__c`'s `Broker__c`, off-market from
                             `Disposition__c.Broker__c`. It is rendered as text rather than as
                             a `disabled` lookup because a disabled lookup still looks like a
                             control someone may enable, and there is no case in which this
                             value should be hand-picked on an offer.
                             🔴 THERE IS NO "not appointed yet" BRANCH HERE ANY MORE. It moved
                             to the refusal panel above — this block is unreachable without a
                             broker, which is also what lets the JS send `Broker__c`
                             unconditionally instead of omitting it when null.
                             🔴 `Disposition__c.Selected_Broker__c` IS NOT THE SOURCE AND MUST
                             NEVER BE PARSED — it reads "Firm" on on-market rows and
                             "Person - Firm" on off-market ones, and its own field metadata
                             states "NO CONSUMER MAY PARSE THIS FIELD".
                             ═══════════════════════════════════════════════════════════════ -->
                        <div class="lom-field lom-field-broker lom-field_full">
                            <span class="lom-readonly-label">Broker</span>
                            <p class="lom-readonly-value">{brokerName}</p>
                            <p class="lom-readonly-help">{brokerSource}</p>
                        </div>

                        <!-- REQUIRED BY A VALIDATION RULE (Offer_Amount_Required_On_Offer).
                             The amount is the entire point: the offers card ranks on it and
                             the Select Offer screen chooses between amounts. -->
                        <lightning-input-field
                            class="lom-field lom-field-amount"
                            field-name="Offer_Amount__c"
                            required
                        ></lightning-input-field>

                        <lightning-input-field
                            class="lom-field lom-field-date"
                            field-name="Offer_Date__c"
                        ></lightning-input-field>

                        <!-- ═══════════════════════════════════════════════════════════════
                             🔴 `Offer_Financing_Type__c` IS KEPT ON PURPOSE. THE USER ASKED
                             FOR IT TO BE HIDDEN AND IT IS STILL HERE. DO NOT REMOVE IT
                             WITHOUT RE-READING THIS.
                             ═══════════════════════════════════════════════════════════════
                             It is not an isolated form field. It is READ on two decision
                             surfaces, neither of which has any other way to acquire it:
                               - c/dispositionOfferSelect renders it into the radio label of
                                 the Select Offer screen action — the screen where DPEG picks
                                 the winning bid;
                               - it is an `approvalPageField` on `Offer_Selection_Approval`,
                                 so the two named approvers see it when they sign off.
                             Nothing writes it but a human. Drop it from the only entry point
                             and BOTH surfaces render blank on every offer created afterwards,
                             permanently, with no error anywhere.
                             ⚠ ITS VALUE WENT UP ON 2026-08-21. The buyer name was removed
                             from that radio label, so the financing type is now one of only
                             three things telling two offers on one sale apart.
                             ═══════════════════════════════════════════════════════════════ -->
                        <lightning-input-field
                            class="lom-field lom-field-financing"
                            field-name="Offer_Financing_Type__c"
                        ></lightning-input-field>

                        <lightning-input-field
                            class="lom-field lom-field-earnest"
                            field-name="Earnest_Money_Proposed__c"
                        ></lightning-input-field>

                        <lightning-input-field
                            class="lom-field lom-field-dd"
                            field-name="Due_Diligence_Days__c"
                        ></lightning-input-field>

                        <lightning-input-field
                            class="lom-field lom-field-closing"
                            field-name="Closing_Period_Days__c"
                        ></lightning-input-field>
                    </div>

                    <!-- ═══════════════════════════════════════════════════════════════════
                         🔴 SEVEN FIELDS ARE DELIBERATELY ABSENT. EACH EXCLUSION IS ARGUED.
                         ═══════════════════════════════════════════════════════════════════
                         `Name`                 AutoNumber. The platform assigns it.
                         `Buyer__c`,
                         `Buyer_Name__c`        🔴 REMOVED 2026-08-21 WITH THE BUYER ITSELF.
                                                DPEG communicates only with the appointed
                                                broker; buyers are not tracked. The lookup is
                                                NOT deleted from the object — a separate
                                                retirement wave owns that — and
                                                DispositionOfferBuyerStampService still exists
                                                and is simply never triggered, because it is
                                                change-keyed on `Buyer__c` and nothing sets it.
                                                ⚠ `Buyer_Required_On_Offer` IS STILL ACTIVE and
                                                must be deactivated declaratively; see the JS
                                                header. This form cannot satisfy it.
                         `NDA_Status__c`        User-requested removal, and CLEAN: repo-wide it
                                                is referenced only by the layout, the two
                                                permission sets, the object translation and the
                                                seed script.
                         `Offer_Status__c`      User-requested removal. It is still editable on
                                                the record itself — this dialog only CREATES —
                                                so the ability is moved, not destroyed.
                         `Is_Selected__c`,
                         `Approval_Status__c`   Machine-written by
                                                DispositionApprovalService.selectOffer and by
                                                Offer_Selection_Approval's finalApprovalActions
                                                respectively; both already Readonly on the
                                                layout and editable=false in DPEG_Disposition_Edit,
                                                so rendering either raises an FLS error inside
                                                the form rather than being silently skipped.
                         The four counter/close fields (`Buyer_Counter_Price__c`,
                         `DPEG_Counter_Price__c`, `DPEG_Counter_Date__c`,
                         `Final_Agreed_Price__c`) are absent because an offer being LOGGED has
                         by definition not been countered or closed yet.
                         ═══════════════════════════════════════════════════════════════════ -->
                </lightning-record-edit-form>
            </template>
        </div>
    </lightning-modal-body>

    <lightning-modal-footer>
        <lightning-button
            class="lom-cancel"
            label={cancelLabel}
            onclick={handleCancel}
        ></lightning-button>
        <!-- 🔴 IN THE REFUSAL PANEL THERE IS NO SAVE BUTTON AT ALL, not a disabled one. A
             disabled Save invites a click and then explains nothing; its absence, next to the
             explanation above, is unambiguous. -->
        <template lwc:if={canSave}>
            <lightning-button
                class="lom-save slds-m-left_x-small"
                variant="brand"
                label="Save offer"
                onclick={handleSave}
                disabled={isSaving}
            ></lightning-button>
        </template>
    </lightning-modal-footer>
</template>
