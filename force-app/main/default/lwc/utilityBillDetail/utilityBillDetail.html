<template>
    <lightning-card>
        <div slot="title" class="hdr">
            <span class="hdr-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A9ED4"
                    stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="16" rx="2" />
                    <path d="M7 9h10M7 13h6M7 17h4" />
                </svg>
            </span>
            <span class="hdr-title">Bill Detail &amp; Variance</span>
        </div>

        <template lwc:if={error}>
            <div
                class="slds-p-around_x-small slds-text-color_error slds-grid slds-grid_vertical-align-center"
                role="alert"
            >
                <lightning-icon
                    icon-name="utility:error"
                    size="x-small"
                    variant="error"
                    alternative-text="Error"
                    class="slds-m-right_x-small"
                ></lightning-icon>
                <span>{errorMessage}</span>
            </div>
        </template>

        <template lwc:if={hasDetail}>
            <div class="ubd">
                <!-- Meter and location, so the panel identifies its own subject. -->
                <p class="ubd-subject">{meterLabel}</p>
                <p class="ubd-location">{locationLabel}</p>

                <!-- Readings. dt/dd only, in order, no wrappers - axe's definition-list
                     rule is strict and the columns are done in CSS. -->
                <dl class="ubd-readings">
                    <dt class="ubd-key">Previous reading</dt>
                    <dd class="ubd-val">
                        <lightning-formatted-number
                            value={detail.previousReading}
                            maximum-fraction-digits="2"
                        ></lightning-formatted-number>
                    </dd>
                    <dt class="ubd-key">Current reading</dt>
                    <dd class="ubd-val">
                        <lightning-formatted-number
                            value={detail.currentReading}
                            maximum-fraction-digits="2"
                        ></lightning-formatted-number>
                    </dd>
                    <dt class="ubd-key">Consumption</dt>
                    <dd class="ubd-val">
                        <lightning-formatted-number
                            value={detail.consumption}
                            maximum-fraction-digits="2"
                        ></lightning-formatted-number>
                    </dd>
                    <dt class="ubd-key">Rate per unit</dt>
                    <dd class="ubd-val">
                        <lightning-formatted-number
                            value={detail.ratePerUnit}
                            format-style="currency"
                            currency-code="USD"
                            maximum-fraction-digits="4"
                        ></lightning-formatted-number>
                    </dd>
                    <dt class="ubd-key">Total charges</dt>
                    <dd class="ubd-val">
                        <lightning-formatted-number
                            value={detail.totalCharges}
                            format-style="currency"
                            currency-code="USD"
                            maximum-fraction-digits="2"
                        ></lightning-formatted-number>
                    </dd>
                </dl>

                <!-- The refusal notice. Present ONLY when the readings decrease and the
                     domain declined to guess between a rollover and a meter swap. -->
                <template lwc:if={hasConsumptionWarning}>
                    <div class="ubd-warning" role="status">
                        <lightning-icon
                            icon-name="utility:info"
                            size="x-small"
                            alternative-text="Notice"
                            class="slds-m-right_x-small"
                        ></lightning-icon>
                        <span>{consumptionWarning}</span>
                    </div>
                </template>

                <!-- FSD 5.10.5 decomposition. -->
                <c-utility-bill-variance
                    usage-variance={detail.usageVariance}
                    rate-variance={detail.rateVariance}
                    total-variance={detail.totalVariance}
                    total-variance-pct={detail.totalVariancePct}
                    prior-bill-label={priorBillLabel}
                    has-prior={hasPrior}
                ></c-utility-bill-variance>

                <!-- Charge components (FSD 5.10.3): they vary by utility and appear
                     irregularly, which is why they are rows and not fixed columns. -->
                <h3 class="ubd-section">Charge components ({chargeLineCount})</h3>
                <template lwc:if={hasNoChargeLines}>
                    <p class="ubd-empty">
                        No charge components recorded yet, so the bill total is zero and no
                        rate or variance can be calculated. Add the components from the
                        invoice.
                    </p>
                </template>
                <ul class="ubd-charges">
                    <template for:each={chargeRows} for:item="line">
                        <li key={line.id} class="ubd-charge">
                            <span class="ubd-charge-type">{line.chargeType}</span>
                            <span class="ubd-charge-share">{line.shareLabel}</span>
                            <span class="ubd-charge-amount">
                                <lightning-formatted-number
                                    value={line.amount}
                                    format-style="currency"
                                    currency-code="USD"
                                    maximum-fraction-digits="2"
                                ></lightning-formatted-number>
                            </span>
                        </li>
                    </template>
                </ul>
            </div>
        </template>
    </lightning-card>
</template>
