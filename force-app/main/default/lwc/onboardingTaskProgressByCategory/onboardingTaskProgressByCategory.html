<template>
    <div class="card">
        <div class="hd">
            <lightning-icon icon-name="standard:task" size="small" class="hd__icon"></lightning-icon>
            <span class="hd__title">Task Progress by Category</span>
        </div>
        <template lwc:if={error}>
            <div class="slds-p-around_x-small slds-text-color_error slds-grid slds-grid_vertical-align-center" role="alert">
                <lightning-icon icon-name="utility:error" size="x-small" variant="error" class="slds-m-right_x-small"></lightning-icon>
                <span>{errorMessage}</span>
            </div>
        </template>
        <div class="cards-grid">
            <template for:each={cards} for:item="c">
                <c-onboarding-card-child
                    key={c.key}
                    value={c.value}
                    label={c.label}
                    icon-name={c.iconName}
                    icon-color={c.iconColor}
                    done={c.done}>
                </c-onboarding-card-child>
            </template>
        </div>
    </div>
</template>
