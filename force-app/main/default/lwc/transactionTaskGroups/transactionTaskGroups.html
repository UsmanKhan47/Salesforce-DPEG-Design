<template>
    <div class="tg">
        <!-- Three mutually exclusive states. An empty checklist is VISIBLY empty; it never
             renders as blank space that reads like a successful load of nothing.

             ⚠ AMENDED 2026-09-03 (M5). There was a FOURTH, first: a `hasModelError` block for a
             failed read of the model discriminator (Transaction__c.Checklist_Fanned_Out__c). That
             flag no longer selects a data model — the legacy Task model is retired — so a failed
             read of it is advisory and must NOT blank a checklist that loaded fine. It now only
             softens one sentence of {emptyMessage}. See the JS class header. -->

        <!-- 1. The checklist data failed to load. -->
        <template if:true={hasDataError}>
            <div class="tg-error" role="alert">
                <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
                <span>{dataErrorMessage}</span>
            </div>
        </template>

        <!-- 2. Genuinely empty, with a message that names the CAUSE of the emptiness. -->
        <template if:true={showEmpty}>
            <div class="tg-empty">{emptyMessage}</div>
        </template>

        <!-- 3. Content. -->
        <template if:true={showContent}>
            <!-- Phase cards (hidden when this instance is pinned to a phase via its tab) -->
            <template if:true={showPhaseButtons}>
                <div class="tg-phases">
                    <template for:each={phases} for:item="p">
                        <button key={p.key} class={p.cls} data-phase={p.key} onclick={selectPhase}
                            disabled={p.disabled} type="button" aria-pressed={p.selected}>
                            <span class="tg-phase-top">
                                <span class="tg-phase-ico">
                                    <lightning-icon icon-name={p.icon} size="x-small"></lightning-icon>
                                </span>
                                <span class="tg-phase-name">{p.name}</span>
                                <template if:true={p.done}>
                                    <lightning-icon icon-name="utility:check" size="xx-small"
                                        class="tg-phase-check"></lightning-icon>
                                </template>
                            </span>
                            <span class="tg-phase-stats">
                                <span class="tg-phase-count">{p.countLabel}</span>
                                <span class="tg-phase-pct">{p.pctLabel}</span>
                            </span>
                            <span class="tg-phase-bar"><span class={p.barClass} style={p.barStyle}></span></span>
                        </button>
                    </template>
                </div>
            </template>

            <template if:true={phaseEmpty}>
                <div class="tg-empty">No checklist items in this phase yet.</div>
            </template>

            <!-- Group tabs (for the selected phase) above the full-width item list -->
            <div class="tg-pane" if:false={phaseEmpty}>
                <div class="tg-groups">
                    <template for:each={railItems} for:item="s">
                        <button key={s.key} class={s.itemClass} data-key={s.key} onclick={select} type="button">
                            <span class={s.ringClass} style={s.ringStyle}>
                                <span class="tg-ring-inner">{s.letter}</span>
                            </span>
                            <span class="tg-gchip-body">
                                <span class="tg-gchip-name">{s.name}</span>
                                <span class="tg-gchip-sub">
                                    <span class="tg-gchip-count">{s.countLabel}</span>
                                    <template if:true={s.complete100}>
                                        <lightning-icon icon-name="utility:success" size="xx-small"
                                            class="tg-done-icon"></lightning-icon>
                                    </template>
                                </span>
                            </span>
                        </button>
                    </template>
                </div>

                <div class="tg-detail">
                    <div class="tg-detail-head">
                        <span class={current.badgeClass}>{current.letter}</span>
                        <div class="tg-detail-titles">
                            <div class="tg-detail-name">
                                <span>{current.name}</span>
                                <template if:true={current.conditional}><span class="tg-cond">Conditional</span></template>
                            </div>
                            <div class="tg-detail-sub">
                                <span class="tg-owner">{current.ownerLabel}</span>
                                <span class="tg-detail-count">{current.countLabel}</span>
                            </div>
                        </div>
                    </div>
                    <div class="tg-detail-track"><div class={current.barClass} style={current.barStyle}></div></div>
                    <ul class="tg-tasks">
                        <template for:each={current.rows} for:item="r">
                            <li key={r.id} class={r.rowClass}>
                                <input type="checkbox" class="tg-check" checked={r.done} disabled={r.disabled}
                                    data-id={r.id} data-wire={r.wire} data-capture={r.capture}
                                    data-subject={r.subject}
                                    aria-label={r.subject} onchange={handleCheck} />
                                <span class="tg-subject">{r.subject}</span>
                                <template if:true={r.showCritical}>
                                    <span class="tg-flag" title="Critical control — verify before proceeding">
                                        <lightning-icon icon-name="utility:shield" size="xx-small"
                                            class="tg-flag-icon"></lightning-icon>Critical
                                    </span>
                                </template>
                                <!-- Advisory only. The enforcement is the before-update trigger plus the
                                     Prerequisite_Must_Be_Met_To_Complete validation rule; this pill just
                                     tells the truth BEFORE the user types a comment and gets refused. -->
                                <template if:true={r.blocked}>
                                    <span class="tg-blocked"
                                        title="An earlier step must be completed first. This is the wire-fraud prerequisite control.">
                                        <lightning-icon icon-name="utility:lock" size="xx-small"
                                            class="tg-blocked-icon"></lightning-icon>Blocked
                                    </span>
                                </template>
                                <template if:true={r.verified}>
                                    <span class="tg-flag tg-flag--ok" title="Verbal wire verification on file">
                                        <lightning-icon icon-name="utility:check" size="xx-small"
                                            class="tg-ok-icon"></lightning-icon>{r.verifiedLabel}
                                    </span>
                                </template>
                                <span class="tg-meta">{r.meta}</span>
                                <template if:true={r.hasDetails}>
                                    <button class="tg-view-btn" data-id={r.id} onclick={viewTask}
                                        type="button" title="View saved details">View</button>
                                </template>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>
        </template>
    </div>

    <!-- Wire-fraud verification modal (DPEG brief Section 06) -->
    <template if:true={showWireModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="tg-wire-heading"
            class="slds-modal slds-fade-in-open tg-modal tg-modal--wire">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close"
                        title="Close" type="button" onclick={cancelWire}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                    </button>
                    <h2 id="tg-wire-heading" class="slds-modal__title slds-hyphenate">Complete Wire Verification</h2>
                    <p class="tg-modal-sub">{wireSubject}</p>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="tg-verify-banner">
                        <lightning-icon icon-name="utility:shield" size="x-small" class="tg-flag-icon"></lightning-icon>
                        <span>Anti-fraud control: call the title company / lender on an independently looked-up number
                            and verify every digit by phone before closing this item.</span>
                    </div>
                    <lightning-input type="text" label="Confirmed by (name)" value={wireVerifiedBy}
                        onchange={handleVerifiedBy} required field-level-help="Person who verbally confirmed the wiring instructions">
                    </lightning-input>
                    <lightning-input type="text" label="Phone number used" value={wirePhone}
                        onchange={handlePhone} required class="slds-m-top_small"
                        field-level-help="Independently looked-up number you called to verify">
                    </lightning-input>
                    <lightning-textarea label="Comments" value={wireComments}
                        onchange={handleWireComments} class="tg-notes-input slds-m-top_small"
                        placeholder="Add comments for this verification…">
                    </lightning-textarea>
                    <template if:true={hasWireError}>
                        <p class="tg-modal-error" role="alert">{wireError}</p>
                    </template>
                    <p class="tg-modal-note">Your comments and a verification note will be saved to this item automatically.</p>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" type="button" onclick={cancelWire}>Cancel</button>
                    <button class="slds-button slds-button_brand" type="button" onclick={submitWire}
                        disabled={wireSaveDisabled}>
                        Mark Verified &amp; Complete
                    </button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Confirm-complete dialog -->
    <template if:true={showConfirmModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="tg-confirm-heading"
            class="slds-modal slds-fade-in-open tg-modal tg-modal--confirm">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close"
                        title="Close" type="button" onclick={cancelConfirm}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                    </button>
                    <h2 id="tg-confirm-heading" class="slds-modal__title slds-hyphenate">Complete Item?</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p class="tg-confirm-subject">{confirmSubject}</p>
                    <lightning-textarea label="Comments" value={confirmNotes}
                        onchange={handleConfirmNotes} class="tg-notes-input slds-m-top_small"
                        placeholder="Add comments for this item…">
                    </lightning-textarea>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" type="button" onclick={cancelConfirm}>Cancel</button>
                    <button class="slds-button slds-button_brand" type="button" onclick={confirmComplete}
                        disabled={confirmSaveDisabled}>Confirm</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Capture dialog (Phase 5) — records the item's OUTPUT before it is allowed to close.
         Field captures bind a lightning-record-edit-form to the Loan__c / Insurance_Binder__c the
         server provisioned, so LDS does the write and enforces FLS, restricted picklists and
         validation rules. Document captures use lightning-file-upload, which publishes the
         ContentVersion in the platform's own transaction — no Apex publish path exists in Phase 5,
         which is what keeps the org's ContentPublication quota untouched. -->
    <template if:true={showCaptureModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="tg-capture-heading"
            class="slds-modal slds-fade-in-open tg-modal tg-modal--capture">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close"
                        title="Close" type="button" onclick={cancelCapture}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                    </button>
                    <h2 id="tg-capture-heading" class="slds-modal__title slds-hyphenate">Record &amp; Complete</h2>
                    <p class="tg-modal-sub">{captureSubject}</p>
                </header>
                <div class="slds-modal__content slds-p-around_medium tg-capture-body">
                    <template if:true={captureLoading}>
                        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                    </template>

                    <template if:true={hasCaptureRequirement}>
                        <p class="tg-modal-note" role="note">{captureRequirementMessage}</p>
                    </template>

                    <template if:true={isFieldCapture}>
                        <lightning-record-edit-form class="tg-capture-form"
                            object-api-name={captureObjectApiName}
                            record-id={captureTargetRecordId}
                            onsuccess={handleCaptureSuccess}
                            onerror={handleCaptureError}>
                            <template for:each={captureFieldRows} for:item="f">
                                <lightning-input-field key={f.key} field-name={f.name}></lightning-input-field>
                            </template>
                        </lightning-record-edit-form>
                    </template>

                    <template if:true={isDocumentCapture}>
                        <lightning-file-upload label="Upload document"
                            name="tgCaptureUpload"
                            accept={captureAcceptedFormats}
                            record-id={captureTargetRecordId}
                            onuploadfinished={handleUploadFinished}>
                        </lightning-file-upload>
                        <template if:true={captureDocumentOnFile}>
                            <p class="tg-capture-ok">
                                <lightning-icon icon-name="utility:check" size="xx-small"
                                    class="tg-ok-icon"></lightning-icon>
                                A document is on file for this item.
                            </p>
                        </template>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" type="button" onclick={cancelCapture}>Cancel</button>
                    <button class="slds-button slds-button_brand" type="button" onclick={submitCapture}
                        disabled={captureSaveDisabled}>Save &amp; Complete</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- View-details dialog (read-only) -->
    <template if:true={showViewModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="tg-view-heading"
            class="slds-modal slds-fade-in-open tg-modal tg-modal--view">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close"
                        title="Close" type="button" onclick={closeView}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                    </button>
                    <h2 id="tg-view-heading" class="slds-modal__title slds-hyphenate">Item Details</h2>
                    <p class="tg-modal-sub">{viewData.subject}</p>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={viewData.hasWire}>
                        <div class="tg-view-row">
                            <span class="tg-view-label">Confirmed by</span>
                            <span class="tg-view-val">{viewData.verifiedBy}</span>
                        </div>
                        <div class="tg-view-row">
                            <span class="tg-view-label">Phone used</span>
                            <span class="tg-view-val">{viewData.phone}</span>
                        </div>
                        <div class="tg-view-row">
                            <span class="tg-view-label">Verified at</span>
                            <span class="tg-view-val">{viewData.verifiedAt}</span>
                        </div>
                    </template>
                    <template if:true={viewData.hasNotes}>
                        <div class="tg-view-notes-label">Comments</div>
                        <p class="tg-view-notes">{viewData.notes}</p>
                    </template>
                    <template if:false={viewData.hasAny}>
                        <p class="tg-modal-note">No additional details were recorded for this item.</p>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_brand" type="button" onclick={closeView}>Close</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
