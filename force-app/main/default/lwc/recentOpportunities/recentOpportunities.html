<template>
    <lightning-card icon-name="standard:opportunity">
        <span slot="title">Recent Opportunities ({count})</span>

        <c-list-datatable
            key-field="id"
            data={rows}
            columns={columns}
            hide-checkbox-column>
        </c-list-datatable>

        <div slot="footer" class="view-all-footer">
            <a href={listUrl} onclick={viewAll}>View All</a>
        </div>
    </lightning-card>
</template>
