<template>
    <lightning-card icon-name="standard:currency">
        <span slot="title">
            Counter Offers ({count})
            <template lwc:if={hasBall}>
                <span class={ballBadgeClass} style="margin-left:8px">{ballBadgeLabel}</span>
            </template>
        </span>

        <template lwc:if={hasPrimaryLoi}>
            <lightning-button
                slot="actions"
                label="Add"
                icon-name="utility:add"
                onclick={handleAdd}
                disabled={editing}>
            </lightning-button>
        </template>

        <div class="slds-p-horizontal_small slds-p-bottom_small">
            <template lwc:if={hasPrimaryLoi}>
                <!-- Entry form -->
                <template lwc:if={editing}>
                    <div class="slds-box slds-box_x-small slds-m-bottom_small">
                        <lightning-radio-group
                            name="direction"
                            label="Who countered?"
                            options={directionOptions}
                            value={direction}
                            type="button"
                            onchange={handleDirectionChange}>
                        </lightning-radio-group>
                        <div class="slds-grid slds-gutters slds-m-top_x-small">
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input
                                    type="number"
                                    formatter="currency"
                                    label="Counter Price"
                                    value={counterPrice}
                                    onchange={handlePriceChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input
                                    type="number"
                                    step="0.01"
                                    label="Cap Rate (%)"
                                    value={counterCapRate}
                                    onchange={handleCapRateChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input
                                    type="date"
                                    label="Counter Date"
                                    value={counterDate}
                                    onchange={handleDateChange}>
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-gutters slds-m-top_x-small">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input
                                    label="Revision Number"
                                    value={revisionNumber}
                                    onchange={handleRevisionNumberChange}
                                    placeholder="e.g. v3, Rev B">
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input
                                    label="Subsequent Version"
                                    value={subsequentVersion}
                                    onchange={handleSubsequentVersionChange}
                                    placeholder="e.g. v4">
                                </lightning-input>
                            </div>
                        </div>
                        <lightning-textarea
                            class="slds-m-top_x-small"
                            label="Counter Response"
                            value={counterResponse}
                            onchange={handleResponseChange}>
                        </lightning-textarea>
                        <div class="slds-m-top_small">
                            <lightning-button
                                class="slds-m-right_x-small"
                                variant="brand"
                                label="Save"
                                onclick={handleSave}>
                            </lightning-button>
                            <lightning-button
                                variant="neutral"
                                label="Cancel"
                                onclick={handleCancel}>
                            </lightning-button>
                        </div>
                    </div>
                </template>

                <!-- History, native related-list datatable (newest first) -->
                <template lwc:if={hasOffers}>
                    <c-list-datatable
                        key-field="id"
                        data={rows}
                        columns={columns}
                        sorted-by={sortedBy}
                        sorted-direction={sortedDirection}
                        onsort={handleSort}
                        show-row-number-column
                        hide-checkbox-column>
                    </c-list-datatable>
                </template>
                <template lwc:else>
                    <p class="slds-text-color_weak slds-p-vertical_x-small">No counter offers yet.</p>
                </template>
            </template>
            <template lwc:else>
                <p class="slds-text-color_weak">
                    Set a Primary LOI on this deal to record a counter offer.
                </p>
            </template>
        </div>
    </lightning-card>
</template>
