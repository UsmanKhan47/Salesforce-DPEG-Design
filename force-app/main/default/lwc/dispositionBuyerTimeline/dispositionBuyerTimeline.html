<template>
    <!-- 🔴 THE CARD CHROME IS UNCONDITIONAL. Every branch below renders INSIDE it.
         Before 2026-08-21 this template emitted a bare, title-less <div> per branch and
         nothing at all before the wire answered, which read on the record page as an
         unlabelled fragment of text floating between two proper cards. A titled card that
         is briefly empty tells the user WHICH panel is still thinking; an untitled blob
         tells them nothing. The count is appended only once the wire has answered — see
         `cardTitle` in the JS for why a premature "(0)" is a claim this card may not make.
         ⚠ THE ICON IS `standard:contract`, NOT `standard:buyer_group`. It changed with the
         subject of the card: these are NDAs, not buyers. -->
    <lightning-card icon-name="standard:contract">
        <span slot="title">{cardTitle}</span>

        <!-- ERROR: visible and loud. The controller throws rather than returning an empty
             list precisely so this branch exists — a silent blank card would be a confident
             wrong answer. `lv-error` is the ONE genuinely cross-bundle class in this repo
             (shared with recentLeads / recentOpportunities / renewalList /
             competingBrokerSubmissions) — do not rename it.
             ⚠ EXPECT THIS BRANCH RIGHT AFTER DEPLOY until both disposition permission sets
             grant the new `NDA__c.Broker__c` — see the JS header. -->
        <template lwc:if={hasError}>
            <div
                class="lv-error dbt-error slds-p-around_medium slds-text-color_error"
                role="alert"
            >
                {loadError}
            </div>
        </template>

        <template lwc:else>
            <!-- DATA: ONE CHRONOLOGICAL LIST, ONE ENTRY PER RECORD, TWO KINDS OF ENTRY.
                 ═══════════════════════════════════════════════════════════════════════
                 🔴 RESTYLED 2026-08-24 TO THE USER-SUPPLIED TIMELINE DESIGN — AND IT IS
                 STILL ONE CARD WITH ONE LIST.
                 ═══════════════════════════════════════════════════════════════════════
                 The design was read as a VISUAL LANGUAGE, not as a layout to copy: a
                 coloured icon chip in the header (already present — a `standard:` icon
                 on a lightning-card renders as a filled coloured chip, and the sibling
                 card uses the identical mechanism), the count in the title (already
                 present), a vertical rail down the left, and each entry as a compact
                 block of headline / muted meta / labelled detail. It was NOT read as an
                 instruction to split this into three sections or three cards: the whole
                 point of the 2026-08-24 merge was that the two sources interleave.

                 WHAT ACTUALLY CHANGED IS THE CONTAINER, NOT THE CONTENT:
                   · the `repeat(auto-fill, minmax(min(18rem,100%), 1fr))` TILE GRID is
                     gone. ⚠ A timeline is single-column BY DEFINITION — two entries side
                     by side leave the rail drawing a line between things that are not
                     consecutive. That is why the multi-column guard it used to need is
                     also gone, and why re-adding `auto-fill` reds T-CSS;
                   · each <li> is now `[rail][body]`, the rail being a straight port of
                     c/bovBrokerChangeHistory's (see the comment on it below);
                   · the per-entry BORDER + FILL is gone. The rail and the entry's bottom
                     padding separate one entry from the next now, and a box drawn inside
                     a rail is a second container saying the same thing — at ~276px it
                     also cost ~28px of text width the sidebar cannot spare.
                     ⚠ TWO STYLE RULES WENT WITH IT and their JOB DID NOT: the declined
                     entry's grey fill / dashed border, and the response entry's left
                     accent bar. Both were reinforcement of a signal that has always
                     travelled as READABLE TEXT (the "Declined" badge, the method badge,
                     the group's aria-label), and both were retired rather than ported
                     because a 4px accent bar 12px from a 1px rail reads as a second,
                     broken rail. The classes `.dbt-tile--declined` and
                     `.dbt-tile--response` REMAIN on the markup — they are the selector
                     hooks the whole suite tells the two kinds apart with, and the
                     declined entry still mutes its own text.
                   · the CONTENT of an entry is byte-for-byte what it was: same headings,
                     same badges, same broker subtitle, same dt/dd pairs, same milestone
                     rail on the NDA branch. Every existing assertion still applies.

                 ═══════════════════════════════════════════════════════════════════════
                 🔴 THIS WAS A SIX-COLUMN TABLE AND MUST NEVER BECOME ONE AGAIN.
                 ═══════════════════════════════════════════════════════════════════════
                 The previous markup was a CSS grid of
                 `minmax(0, 2fr) repeat(5, minmax(0, 1fr))` with a shared heading row. That
                 is a fine shape in the ~800px main region it was designed for and an
                 unusable one in the ~340px record-page SIDEBAR this card now lives in:
                 five value columns at ~35px each, every date clipped to an ellipsis.

                 The replacement is the same shape c/competingBrokerSubmissions adopted for
                 the same reason: a <ul>/<li> of self-labelling entries, each carrying its
                 own <dl>, so no column has to be shared across rows and nothing scrolls
                 sideways at ANY container width. ⚠ THE 2026-08-24 RESTYLE TOOK THE BOX OFF
                 THOSE ENTRIES BUT NOT THE PROPERTY THAT MATTERS — each one still carries
                 its own labels and shares no column with its neighbours, which is the part
                 that makes the sidebar work. The dt/dd pairs are the single-record
                 equivalent of the <th scope="col"> -> <td> association the table provided;
                 the labels are now VISIBLE TEXT on every tile rather than a heading row far
                 away at the top, which is what makes a tile readable on its own.

                 role="list" is NOT redundant: `list-style: none` makes WebKit drop the
                 implicit list role, and aria-label is only exposed on an element whose role
                 supports naming. axe has no rule for it, so a passing toBeAccessible() is
                 not evidence against it. -->
            <template lwc:if={hasRows}>
                <!-- 🔴 THE INTRO LINE WAS REMOVED ON 2026-08-21 (UAT prose removal). It read
                     "Every NDA raised on this disposition, in order. NDAs that were declined are
                     kept as a record and shown last." — a description of the list the list itself
                     already demonstrates. The `id="dbt-intro"` went with it, and so did the
                     `aria-describedby` below that pointed at it: ⚠ AN aria-describedby NAMING A
                     REMOVED ELEMENT IS WORSE THAN NONE, because it promises a description that
                     resolves to nothing.
                     ⚠ THE ORDERING FACT THE SENTENCE CARRIED IS STILL TRUE AND STILL THE
                     SERVER'S: declined NDAs come last because `NdaSelector` puts them last, not
                     because this component sorts. See the JS header — that is where it belongs.

                     ⚠ THE LIST'S aria-label TRACKS THE CARD TITLE ON PURPOSE. A
                     screen-reader user hears the card name and then the list name;
                     two different names for the same region reads as two regions.
                     Retitled with the card on 2026-08-21 and again on 2026-08-24, and
                     pinned by T-NARROW.
                     ⚠ IT IS SENTENCE CASE ("Buyer activity timeline") while the card
                     title is "Buyer Activity timeline". That difference is PRE-EXISTING
                     (the aria-label has been sentence case since it was added) and was
                     left alone on 2026-08-24: only the word changed. Case is not
                     announced by any screen reader, so the two still read as one
                     region — but the exact strings are pinned in the suite, so do not
                     "align" them casually. -->
                <ul
                    class="dbt-list"
                    role="list"
                    aria-label="Buyer activity timeline"
                >
                    <template for:each={timelineRows} for:item="row">
                        <li key={row.id} class="dbt-item">
                            <!-- ═══════════════════════════════════════════════════════
                                 THE ENTRY RAIL (2026-08-24) — A DOT PER ENTRY, JOINED.
                                 ═══════════════════════════════════════════════════════
                                 🔴 THIS IS THE SAME RAIL AS c/bovBrokerChangeHistory's
                                 `.bbc-rail` / `.bbc-dot` / `.bbc-track`, deliberately —
                                 the two cards sit in the SAME sidebar on the SAME record
                                 page, and two implementations of one visual idea drift
                                 apart on the first change to either. The markup and the
                                 CSS treatment are ports of that bundle's; only the class
                                 prefix differs (LWC styles are per-bundle, so the rules
                                 cannot literally be shared).

                                 ⚠ IT IS DECORATIVE AND `aria-hidden`. It carries nothing
                                 the entry's own text does not: the dot marks "this is one
                                 entry" and the track joins it to the next. An announced
                                 pair of empty spans per entry is noise.

                                 🔴 IT SITS OUTSIDE THE GROUP DIV, NOT INSIDE IT. The
                                 group is the addressable ENTRY (role + aria-label +
                                 `.dbt-tile`, which is what every row assertion in the
                                 suite selects); putting decoration inside it would make
                                 the rail part of the thing a screen reader announces and
                                 would put a non-text child inside the labelled group.

                                 🔴 EVERY ENTRY GETS ONE, BOTH KINDS. See the response
                                 branch below for why that does NOT contradict the
                                 "no rail on a response" rule — it is a different rail. -->
                            <div class="dbt-rail" aria-hidden="true">
                                <span class="dbt-dot"></span>
                                <span class="dbt-track"></span>
                            </div>

                            <!-- ⚠ THE GROUP ROLE SITS ON THIS INNER DIV, NOT ON THE <li>.
                                 role="group" on the <li> would replace its implicit
                                 `listitem` role, and axe's `list` rule then reports the
                                 <ul> as having a disallowed child — so the accessible
                                 name would cost the list semantics it was added to
                                 complement.
                                 ⚠ ACCESSIBILITY: the tile's state travels as READABLE
                                 TEXT — the visible "Declined" badge below AND this
                                 aria-label. Colour alone is not a state. -->
                            <div
                                class={row.tileClass}
                                role="group"
                                aria-label={row.rowLabel}
                            >
                            <!-- ═══════════════════════════════════════════════════════
                                 🔴 TWO KINDS OF TILE SINCE 2026-08-24 (the merge).
                                 ═══════════════════════════════════════════════════════
                                 The list interleaves buyer NDAs and Release Materials
                                 RESPONSES, newest first, and `kind` decides which tile
                                 renders. The branch is INSIDE the group div on purpose:
                                 the tile chrome (class, role, aria-label) is identical
                                 for both kinds, so the two read as one list and every
                                 existing assertion on that div keeps working.
                                 ⚠ THE NDA BRANCH BELOW IS BYTE-IDENTICAL TO WHAT IT WAS
                                 BEFORE THE MERGE, by instruction — "a user should see new
                                 entries appear, not their existing ones change shape". Do
                                 not "harmonise" the two branches. -->
                            <template lwc:if={row.isResponse}>
                                <!-- A RESPONSE. The heading is the RMR AutoNumber, the
                                     badge is the METHOD as readable text, and the broker
                                     is the subtitle — the same shape as the NDA tile so
                                     the eye reads down one column.
                                     🔴 NO MILESTONE RAIL HERE. STILL TRUE AFTER THE
                                     2026-08-24 RESTYLE — RE-DERIVED, NOT INHERITED.
                                     The card now has TWO rails and they make DIFFERENT
                                     claims, which is the whole reason both can be
                                     correct at once:
                                       · the ENTRY rail (`.dbt-rail`, one dot per <li>,
                                         far left) claims only "this is one entry in a
                                         chronological feed". That is true of an NDA and
                                         equally true of a response, so it is drawn for
                                         BOTH kinds and is uniform;
                                       · the MILESTONE rail (`.dbt-step` markers, inline
                                         with the labels inside this body) claims "this
                                         milestone has happened / is still to come",
                                         which is a claim about a JOURNEY. A response is
                                         a single event with one timestamp, so a marker
                                         beside "Received" would assert a progression
                                         that does not exist.
                                     ⚠ SO THE ORIGINAL REASONING IS NOT RETRACTED — it
                                     was always about the MILESTONE rail, and the
                                     milestone rail still stops at the NDA branch. What
                                     changed is that a second, weaker rail now exists at
                                     the LIST level. Do not "harmonise" them by adding
                                     `.dbt-step` here, and do not withhold `.dbt-rail`
                                     from this branch citing the paragraph above.
                                     ⚠ THE HEADING TAKES `dbt-rmr`, NOT `dbt-nda`. A
                                     shared class would make the existing "one row per
                                     NDA, headed by its NUMBER" assertion silently start
                                     counting responses. -->
                                <div class="dbt-tile-head">
                                    <h3 class="dbt-rmr">{row.responseName}</h3>
                                    <span class="dbt-badge dbt-badge--method">
                                        {row.method}
                                    </span>
                                </div>

                                <p class="dbt-broker">{row.brokerName}</p>

                                <dl class="dbt-facts">
                                    <dt class="dbt-label">Received</dt>
                                    <dd class="dbt-c dbt-mono">
                                        <!-- ⚠ `lightning-formatted-date-time`, NOT the
                                             `formatDate` helper beside it. This value is
                                             a DATETIME — an unambiguous instant — so
                                             rendering it in the viewer's own timezone is
                                             CORRECT. The helper exists for the NDA tile's
                                             bare `YYYY-MM-DD` Apex Dates, where
                                             `new Date(value)` parses as UTC midnight and
                                             renders the day before west of Greenwich. -->
                                        <template lwc:if={row.entryDateTime}>
                                            <lightning-formatted-date-time
                                                value={row.entryDateTime}
                                                year="numeric"
                                                month="short"
                                                day="2-digit"
                                                hour="2-digit"
                                                minute="2-digit"
                                            ></lightning-formatted-date-time>
                                        </template>
                                        <template lwc:else>—</template>
                                    </dd>

                                    <dt class="dbt-label">Notes</dt>
                                    <dd class="dbt-c dbt-notes">{row.notes}</dd>
                                </dl>
                            </template>

                            <template lwc:else>
                                <!-- 🔴 THE HEADING IS THE NDA NUMBER, AND THE BROKER IS
                                     THE SUBTITLE UNDER IT. It was the BUYER'S NAME until
                                     2026-08-21; buyers are not tracked, and the AutoNumber
                                     is the only per-row identity always present. The broker
                                     is one per sale, so it repeats down the list — that is
                                     the data being true, not a bug, and it is placed as a
                                     subtitle rather than a heading precisely so the
                                     repetition reads as context rather than as identity.
                                     🔴 THE CARD IS TITLED "Buyer Activity timeline"
                                     (2026-08-24) AND THE SUBTITLE HERE IS STILL THE
                                     BROKER. That is not an oversight to reconcile: this
                                     module dropped the buyer concept on 2026-08-21 and
                                     there is no buyer identity on the DTO to render. The
                                     card is also NOT GROUPED by the broker — grouping by
                                     it would collapse a three-NDA sale into one row and
                                     delete the timeline. See the JS header, item 0. -->
                                <div class="dbt-tile-head">
                                    <h3 class="dbt-nda">{row.ndaName}</h3>
                                    <template lwc:if={row.isDeclined}>
                                        <span class="dbt-badge dbt-badge--declined">
                                            Declined
                                        </span>
                                    </template>
                                    <template lwc:if={row.hasAnomaly}>
                                        <span
                                            class="dbt-badge dbt-badge--anomaly"
                                            title="These dates are out of order, so the duration cannot be shown."
                                        >
                                            Check dates
                                        </span>
                                    </template>
                                </div>

                                <p class="dbt-broker">{row.brokerName}</p>

                                <!-- dt/dd ONLY, in order and with no wrapper divs — axe's
                                     `definition-list` rule is strict, so the two-track
                                     layout and the milestone rail are done entirely in
                                     CSS. The first two pairs are the NDA JOURNEY (rendered
                                     as a compact vertical timeline: a filled marker for a
                                     milestone that has a date, a hollow one for a milestone
                                     still to come); the last is the DURATION between them,
                                     separated by a rule.
                                     ⚠ THE MARKER IS REINFORCEMENT ONLY. The date cell
                                     already states the milestone's status in words (a
                                     date, or an em-dash), so a user who cannot see the
                                     marker loses nothing.
                                     🔴 THERE IS NO "First offer" PAIR AND NO "Days to
                                     respond" PAIR. Both were deleted on 2026-08-21 because
                                     nothing links an offer to a specific NDA any more —
                                     see the JS header before adding either back. -->
                                <dl class="dbt-facts">
                                    <dt class={row.ndaSignedStepClass}>NDA signed</dt>
                                    <dd class="dbt-c dbt-mono">{row.ndaSigned}</dd>

                                    <dt class={row.materialsStepClass}>
                                        Materials released
                                    </dt>
                                    <dd class="dbt-c dbt-mono">
                                        {row.materialsReleased}
                                    </dd>

                                    <dt class="dbt-label dbt-sep">Days to release</dt>
                                    <dd class="dbt-c dbt-mono dbt-sep">
                                        {row.daysToRelease}
                                    </dd>
                                </dl>
                            </template>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>

            <!-- EMPTY. Centred icon + headline + the explanatory line, rather than the
                 bare grey sentence this used to be. The wording's INTENT is unchanged: it
                 says the rows appear as NDAs are raised, so an empty card reads as
                 "nothing has happened yet" and never as "something is broken".
                 🔴 KEPT THROUGH THE 2026-08-21 PROSE REMOVAL — A JUDGEMENT CALL, NOT AN
                 OVERSIGHT. The user kept empty states explicitly, because they are what
                 distinguish EMPTY from LOADING from BROKEN. The sub-line is doing that job here
                 rather than describing an action, and unlike this card's intro line (deleted
                 above) it names no rule the user could get from anywhere else on the screen.
                 If they want it gone too it is a two-line deletion — the headline must stay. -->
            <!-- ⚠ THE WORDING WIDENED WITH THE 2026-08-24 MERGE, AND THAT WAS NECESSARY
                 RATHER THAN COSMETIC. It read "No NDAs yet" / "Rows appear here as NDAs
                 are raised on this disposition." — which, now that a logged RESPONSE also
                 produces a row, would be a FALSE STATEMENT on the exact screen it appears:
                 the card would say "no NDAs" about a sale that also has no responses, and
                 tell the user rows appear only for NDAs when they appear for both. Two
                 assertions in the Jest suite moved with it. -->
            <template lwc:elseif={isEmpty}>
                <div class="dbt-empty" role="status">
                    <lightning-icon
                        icon-name="utility:groups"
                        size="small"
                        class="dbt-empty-icon"
                    ></lightning-icon>
                    <p class="dbt-empty-text">No activity yet</p>
                    <p class="dbt-empty-sub">
                        Rows appear here as NDAs are raised and responses are logged on
                        this disposition.
                    </p>
                </div>
            </template>
        </template>
    </lightning-card>
</template>
