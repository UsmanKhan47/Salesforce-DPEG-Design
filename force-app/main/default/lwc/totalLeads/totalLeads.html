<template>
    <lightning-card>
        <span slot="title">Leads by Stage</span>
        <template lwc:if={error}>
            <div class="slds-p-horizontal_small slds-p-vertical_x-small slds-text-color_error slds-grid slds-grid_vertical-align-center" role="alert">
                <lightning-icon icon-name="utility:error" size="x-small" variant="error" class="slds-m-right_x-small"></lightning-icon>
                <span>{errorMessage}</span>
            </div>
        </template>
        <div class="cards-wrap">
            <div class="cards-row">
                <template for:each={metrics} for:item="metric">
                    <c-stat-card
                        key={metric.key}
                        value={metric.displayValue}
                        label={metric.label}
                        icon-name={metric.iconName}
                        icon-color={metric.iconColor}>
                    </c-stat-card>
                </template>
            </div>
        </div>
    </lightning-card>
</template>
