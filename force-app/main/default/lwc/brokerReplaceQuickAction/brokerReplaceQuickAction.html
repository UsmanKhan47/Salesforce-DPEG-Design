<template>
    <div class="slds-p-around_medium slds-is-relative qa-body">
        <template if:false={hasData}>
            <div class="qa-loading">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={hasData}>
            <!-- Active: show the replace form -->
            <template if:true={isActive}>
                <div class="qa-note">
                    <lightning-icon icon-name="utility:info" size="xx-small" class="slds-m-right_x-small"></lightning-icon>
                    <span>{replaceNote}</span>
                </div>
                <lightning-combobox
                    label="Incoming broker"
                    value={repBrokerId}
                    placeholder="Select a broker"
                    options={brokerOptionList}
                    onchange={onRepBroker}
                    required
                    class="slds-m-top_small"></lightning-combobox>
                <div class="slds-grid slds-gutters slds-m-top_small">
                    <div class="slds-col">
                        <lightning-combobox label="Reason previous broker ended" value={repReason} options={reasonOptions} onchange={onRepReason}></lightning-combobox>
                    </div>
                    <div class="slds-col">
                        <lightning-input type="date" label="Effective date" value={repDate} onchange={onRepDate}></lightning-input>
                    </div>
                </div>
                <template if:true={error}>
                    <div class="slds-text-color_error slds-m-top_small" role="alert">{error}</div>
                </template>
                <div class="slds-grid slds-grid_align-end slds-m-top_medium">
                    <lightning-button label="Cancel" onclick={close} class="slds-m-right_x-small"></lightning-button>
                    <lightning-button variant="brand" label="Confirm replacement" onclick={confirm} disabled={confirmDisabled}></lightning-button>
                </div>
            </template>

            <!-- Not active: explain why replacement is unavailable -->
            <template if:false={isActive}>
                <p class="slds-m-bottom_medium">
                    Only <strong>Active</strong> listings can have their broker replaced.
                    This listing's status is <strong>{status}</strong>.
                </p>
                <div class="slds-grid slds-grid_align-end">
                    <lightning-button label="Close" onclick={close}></lightning-button>
                </div>
            </template>
        </template>
    </div>
</template>
