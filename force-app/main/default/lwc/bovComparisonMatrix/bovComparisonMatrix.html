<!--
  ══════════════════════════════════════════════════════════════════════════════
  🔴 THIS TEMPLATE IS RENDERED TWICE ON THE SAME PAGE (2026-08-24).
  ══════════════════════════════════════════════════════════════════════════════
  `c/bovBrokerPanel` mounts this bundle twice: once with `preferred-only` (the
  "Preferred Broker" card, ABOVE) and once bare (the "BOV Comparison Matrix"
  card, BELOW). `preferredOnly` defaults `false`, so the second tag's behaviour is
  unchanged by construction — every branch added for the preferred card is opt-in.

  ⚠ THE MOUNT POINT MOVED ON 2026-08-24 AND THE PARENT'S NAME IS NOT COSMETIC.
  It used to be `dispositionMain.html`, directly under `if:true={isBovOutreach}`.
  `c/bovBrokerPanel` now sits between them and owns the header, the three broker
  buttons and the BOV rows those buttons' visibility rules read.

  ══════════════════════════════════════════════════════════════════════════════
  🔴 THERE ARE NO BUTTONS IN THIS TEMPLATE, IN EITHER MODE. DO NOT ADD ONE.
  ══════════════════════════════════════════════════════════════════════════════
  A `<div slot="actions">` holding "Add Broker Response", "Replace Broker" and
  "Add Preferred Broker" stood between the title and the error banner below until
  2026-08-24. All three MOVED — with their getters, their handlers, their modal
  imports and their toasts — to `c/bovBrokerPanel`, so that ONE header carries
  them above BOTH cards instead of the matrix card carrying them for both.

  ⚠ THAT IS ALSO WHY `hideActions` IS GONE RATHER THAN DEFAULTED. The preferred
  instance used to be silenced with `hide-actions`; there is now no action region
  for either instance to suppress, so an `@api` flag that suppresses nothing would
  be a false reassurance to the next reader. The Jest suite pins the absence
  directly: NO `lightning-button` and NO `[slot="actions"]` in either mode.

  🔴 THE WHOLE CARD IS STILL GATED ON `isVisible` HERE, EVEN THOUGH THE PANEL NOW
  GATES THE TAG TOO. The redundancy is deliberate — it keeps this bundle correct
  if it is ever mounted somewhere that does not hold the BOV rows.
  ══════════════════════════════════════════════════════════════════════════════
-->
<template>
    <template lwc:if={isVisible}>
        <lightning-card icon-name="standard:contract">
            <!-- ⚠ THE TITLE IS A GETTER, NOT A LITERAL, because two instances of this
                 template are on screen at once and two cards both reading "BOV
                 Comparison Matrix (n)" would be unreadable. The preferred card's title
                 is SINGULAR ("Preferred Broker") and carries NO count: exactly one
                 preferred broker exists per disposition, so a count would only ever
                 render "(1)". -->
            <span slot="title">{cardTitle}</span>

            <!-- 🔴 NO `slot="actions"` REGION HERE — see the file header. The three
                 broker buttons live on `c/bovBrokerPanel`'s single header, above
                 BOTH cards. A `<div slot="actions">` re-added here would reserve
                 lightning-card's header action region on every instance, including
                 the preferred card, which by requirement has no actions of its own. -->

            <template lwc:if={loadError}>
                <div class="matrix-error" role="alert">{loadError}</div>
            </template>

            <!-- ⚠ `columns` IS A GETTER, NOT THE MODULE CONSTANT. The preferred card
                 drops the Status column: the pill is a CONSTANT on that card, so it
                 costs a column's width to say nothing.
                 🔴 THE CONSTANT FLIPPED ON 2026-08-24, THE DECISION DID NOT. This read
                 "a preferred row is never Selected, so that pill would read Backup on
                 every row forever". The user then decided a preferred broker IS the
                 appointed broker, so it now reads SELECTED on every row forever.
                 ⚠ Showing it would also put TWO green "Selected" pills on one page —
                 one per card — for a disposition that has exactly ONE appointed
                 broker, which reads as the duplicate-Selected defect the exclusivity
                 guard exists to prevent. See PREFERRED_COLUMNS in the JS. -->
            <c-list-datatable
                key-field="id"
                data={rows}
                columns={columns}
                column-widths-mode="auto"
                hide-checkbox-column>
            </c-list-datatable>

            <div slot="footer" class="view-all-footer">
                <a href={listUrl} onclick={viewAll}>View All</a>
            </div>
        </lightning-card>
    </template>
</template>
