<template>
    <lightning-card icon-name="standard:contract">
        <span slot="title">BOV Comparison Matrix ({count})</span>

        <template if:true={loadError}>
            <div class="matrix-error" role="alert">{loadError}</div>
        </template>

        <c-list-datatable
            key-field="id"
            data={rows}
            columns={columns}
            column-widths-mode="auto"
            hide-checkbox-column>
        </c-list-datatable>

        <div slot="footer" class="view-all-footer">
            <a href={listUrl} onclick={viewAll}>View All</a>
        </div>
    </lightning-card>
</template>
