<template>
    <lightning-card>
        <span slot="title">Sell Meter Summary</span>
        <div class="cards-wrap">
            <template if:true={error}>
                <div class="sms-error" role="alert">Sell meter summary could not be loaded: {errorMessage}</div>
            </template>
            <div class="cards-row">
                <template for:each={metrics} for:item="metric">
                    <c-stat-card
                        key={metric.key}
                        value={metric.value}
                        label={metric.label}
                        icon-name={metric.iconName}
                        icon-color={metric.iconColor}>
                    </c-stat-card>
                </template>
            </div>
        </div>
    </lightning-card>
</template>
