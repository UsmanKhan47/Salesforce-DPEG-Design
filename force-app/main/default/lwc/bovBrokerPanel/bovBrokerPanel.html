<!--
  ══════════════════════════════════════════════════════════════════════════════
  c-bov-broker-panel — ONE header, ONE action bar, TWO broker sections (2026-08-24).
  ══════════════════════════════════════════════════════════════════════════════
  This bundle exists to give the BOV Outreach stage a SINGLE header carrying the
  three broker buttons, above two sections that carry their own titles
  ("Preferred Broker", "BOV Comparison Matrix (n)") — user decision.

  🔴 THE THREE BUTTONS MOVED HERE OUT OF `c/bovComparisonMatrix`. That bundle no
  longer renders `slot="actions"`, no longer imports either modal and no longer
  raises a toast: it is a table with a title. Its Jest suite pins that it has NO
  `lightning-button` in either mode, so a button re-added there reds immediately.

  ══════════════════════════════════════════════════════════════════════════════
  🔴 RETRACTED LATER THE SAME DAY — THE TWO CHILDREN ARE NO LONGER ONE BUNDLE.
  ══════════════════════════════════════════════════════════════════════════════
  What stood here read: *"BOTH CHILD TAGS ARE THE SAME BUNDLE … `preferred-only`
  is a BARE attribute — LWC resolves a valueless attribute on a custom element to
  boolean `true`, whereas `preferred-only=""` is the FALSY empty string and would
  turn the top card into a second copy of the matrix. Pinned with `toBe(true)`."*

  THE FLAG IS GONE. The user's design turns the preferred view into a HERO PANEL
  — a green fill, a shield, a label, a firm name and a YES pill — which shares no
  rendering with a datatable, so `c/bovComparisonMatrix` lost `@api preferredOnly`
  entirely and the top child is now `c/bovPreferredBroker`. Read that bundle's
  `.js` header for the full list of what the flag was driving and what came out
  with it. The `toBe(true)` pin is replaced by an assertion on the rendered
  child's `firmName`, which is the whole of the new contract.

  ⚠ THE TOP CHILD TAKES A PROP AND HAS NO WIRE. It is presentational: this
  component already holds every BOV row and already finds the flagged one, so it
  hands the firm name down. That is also why `_refreshAll` below only calls
  `refreshData()` on the matrix — the panel re-renders from this component's own
  wire, with nothing to re-provision.

  🔴 THE PREFERRED PANEL IS GATED **HERE**, WITH `lwc:if`, AND THAT IS THE GAP FIX.
  `dispositionMain.css` documented the defect this replaces: a child that
  self-gates to nothing is STILL a flex item, so a `gap` beside it renders one
  1rem step of empty space with no card in it. There is no CSS escape (a custom
  element with an empty template matches `:empty` either way). The only fix is
  to not render the tag — which needs the BOV rows, and this component has them
  because the three buttons' visibility rules need them anyway. `dispositionMain`
  never did, which is why the defect was accepted there and is fixed here.
  ⚠ RETRACTED IN PLACE: this used to add *"The child ALSO still self-gates on
  `isVisible`. That redundancy is deliberate."* `c/bovPreferredBroker` has NO
  self-gate — it has no data to gate on — so this `lwc:if` is now the ONLY thing
  standing between an absent preferred broker and an empty green panel. Do not
  remove it in favour of a getter inside the child; a child that renders nothing
  is still a flex item and still takes a `gap`, which is the defect above.
-->
<template>
    <lightning-card icon-name="standard:contact">
        <span slot="title">{panelTitle}</span>

        <!-- Top-right actions. `slot="actions"` is lightning-card's own header
             action region, so the buttons sit on the header line rather than
             pushing the cards down.

             🔴 THE ORDER IS THE USER'S AND IT IS UNCHANGED BY THE MOVE:
             Add Broker Response, Replace Broker, Add Preferred Broker. -->
        <div slot="actions">
            <lightning-button-group>
                <lightning-button
                    class="panel-add"
                    label="Add Broker Response"
                    onclick={handleAddResponse}
                ></lightning-button>

                <!-- Only rendered once a broker is Selected — there is nothing to
                     replace before that.

                     🔴 THIS BUTTON NOW HAS TWO DESTINATIONS (2026-08-24). With a
                     preferred broker on the disposition it opens the ADD PREFERRED
                     BROKER dialog in replacement mode; without one it opens the
                     ordinary backup picker exactly as it always did. The branch is
                     in `handleReplaceBroker`, not here, so the button's own
                     visibility rule is untouched. -->
                <template lwc:if={canReplaceBroker}>
                    <lightning-button
                        class="panel-replace"
                        label="Replace Broker"
                        onclick={handleReplaceBroker}
                    ></lightning-button>
                </template>

                <!-- ⚠ HIDDEN ONCE ONE EXISTS, NOT DISABLED. Exactly one preferred
                     broker is permitted per disposition (user decision,
                     2026-08-24) and there is no server-side uniqueness guard on
                     `Is_Preferred_Broker__c`, so the affordance is withdrawn
                     rather than left on screen to be refused.
                     🔴 THIS IS ALSO WHAT MAKES "REPLACE BROKER" THE ONLY ROUTE to
                     changing a preferred broker — the two rules are complementary
                     by construction and must stay that way. -->
                <template lwc:if={canAddPreferredBroker}>
                    <lightning-button
                        class="panel-add-preferred"
                        label="Add Preferred Broker"
                        onclick={handleAddPreferredBroker}
                    ></lightning-button>
                </template>
            </lightning-button-group>
        </div>

        <div class="panel-stack">
            <template lwc:if={hasPreferredBroker}>
                <!-- ⚠ BOTH ATTRIBUTES ARE ALWAYS STRINGS, NEVER `undefined`.
                     Each getter returns `''` when the flagged row carries that
                     value as null, and `c/bovPreferredBroker` turns an empty
                     pair into "Unnamed broker". `Broker_Firm__c` is legitimately
                     nullable and was null on live data this week, and the broker
                     Contact lookup is nullable too.
                     🔴 `contact-name` ADDED 2026-08-25 — the panel now leads with
                     the PERSON and demotes the firm to a muted second line (user
                     instruction: "show broker contacts, not accounts"). Both
                     values come off the SAME `BovController.BovRow`, so this
                     panel and the matrix below it cannot name two different
                     brokers. -->
                <c-bov-preferred-broker
                    contact-name={preferredBrokerContact}
                    firm-name={preferredBrokerFirm}
                ></c-bov-preferred-broker>

                <!--
                    ── THE DIVIDER ──────────────────────────────────────────────
                    🔴 IT LIVES INSIDE THIS `lwc:if`, NOT BETWEEN THE TWO TAGS,
                    AND THAT IS THE WHOLE GUARD. The preferred panel is optional;
                    with no preferred broker the matrix is the ONLY child, and a
                    rule above it would be a hairline with nothing on one side.
                    Sharing the preferred panel's own condition makes the stray
                    case structurally unreachable — there is no state in which
                    this element renders and the panel above it does not. THE
                    DIVIDER THEREFORE STILL APPEARS ONLY WHEN BOTH SECTIONS DO,
                    and that survived the panel rewrite untouched because the
                    condition, not the child's identity, is what enforces it.

                    ⚠ IT IS A FLEX ITEM, NOT A `border-top` ON THE CARD BELOW.
                    Two consequences, both deliberate:
                      - `.panel-stack`'s existing 1rem `gap` therefore applies on
                        BOTH sides of it, so the rule is centred between the two
                        cards BY CONSTRUCTION — no margin, no magic number, and
                        nothing to re-tune if the gap ever changes. (A margin is
                        also forbidden in this stylesheet; see its header.)
                      - A `border-top` would instead sit flush against the lower
                        card's own `lightning-card` border and read as a doubled
                        edge. This is the same call `c/brokerListing` made for
                        `.cfo-rule` earlier today, and the same token.

                    ⚠ DECORATIVE ONLY — `role="presentation"` AND `aria-hidden`.
                    It carries no text and names nothing; the panel's own eyebrow
                    label ("Preferred Broker") and the matrix card's title ("BOV
                    Comparison Matrix (n)") are what tell a screen reader a new
                    section has started.
                -->
                <div
                    class="panel-rule"
                    role="presentation"
                    aria-hidden="true"
                ></div>
            </template>
            <c-bov-comparison-matrix
                record-id={recordId}
            ></c-bov-comparison-matrix>
        </div>
    </lightning-card>
</template>
