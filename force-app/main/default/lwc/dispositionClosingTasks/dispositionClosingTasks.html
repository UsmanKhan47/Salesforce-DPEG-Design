<template>
    <div class="card">
        <div class="card-header">
            <div class="card-title">Closing Checklist</div>
            <template if:false={hasLoadError}>
                <span class="progress-badge" style={badgeStyle}>
                    <span class="badge-dot"></span>{badgeLabel}
                </span>
            </template>
        </div>

        <template if:true={hasLoadError}>
            <div class="task-error" role="alert">
                <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
                <span>Closing checklist could not be loaded: {loadError}</span>
            </div>
        </template>

        <template if:false={hasLoadError}>
            <ul class="task-list">
                <template for:each={rows} for:item="row">
                    <li key={row.id} class={row.rowClass}>
                        <lightning-input
                            type="checkbox"
                            label={row.subject}
                            variant="label-hidden"
                            checked={row.done}
                            data-id={row.id}
                            onchange={handleToggle}>
                        </lightning-input>
                        <div class="task-body">
                            <span class="task-subject">{row.subject}</span>
                            <template if:true={row.metaLabel}>
                                <span class="task-meta">{row.metaLabel}</span>
                            </template>
                        </div>
                    </li>
                </template>
            </ul>
        </template>
    </div>
</template>
