<template>
    <!-- ═══════════════════════════════════════════════════════════════════════════════════════
         🔴 THIS CARD IS DELIBERATELY THE SAME COMPONENT FAMILY AS `c/loiCounterOffer`.
         ═══════════════════════════════════════════════════════════════════════════════════════
         User instruction 2026-08-24: *"make it the same as the LOI counter offers LWC"*. That
         component is the house idiom for a "card with an inline entry form above the log of what
         has already been recorded", and this one was a visual outlier. What was adopted from it,
         verbatim:
           · `<lightning-card icon-name="standard:…">` + `<span slot="title">Label (N)</span>`;
           · THE OPENER LIVES IN `slot="actions"`, labelled "Add" with `utility:add` — NOT a
             button in the body;
           · ONE body wrapper carrying `slds-p-horizontal_small slds-p-bottom_small`;
           · the entry form is an `slds-box slds-box_x-small slds-m-bottom_small`, its fields
             separated by `slds-m-top_x-small`;
           · the form's buttons are `slds-m-top_small`, brand Save FIRST, neutral Cancel SECOND,
             left-aligned;
           · the empty state is muted body text (`slds-text-color_weak`), not a centred icon
             column;
           · 🔴 AND SINCE 2026-08-25, THE LOG ITSELF IS `<c-list-datatable>` — loiCounterOffer's
             own history component, with its `pill` custom cell type carrying the method where a
             `slds-badge` used to. This replaced a `<ul>` of hand-rolled tiles. The retracted
             argument for those tiles claimed a table "does not survive the ~340px sidebar";
             THIS CARD IS IN THE `main` REGION, NOT THE SIDEBAR — see the block itself.
         🔴 SPACING IS EXPLICIT SLDS MARGIN UTILITIES OR AN EXPLICIT `gap` — NEVER RENDERED
         WHITESPACE. The LWC template compiler discards whitespace-only text nodes between sibling
         elements, so two adjacent tags render EDGE TO EDGE with literally nothing between them
         (measured four times this week in this repo). Removing a `slds-m-top_x-small` here does
         not "tighten" the form, it welds two fields together.
         ⚠ WHERE THIS CARD DIVERGES FROM loiCounterOffer, AND WHY, IS RECORDED AT EACH SITE
         BELOW — there are THREE since the log became a datatable (they are numbered 1, 2 and 3;
         the old "DIVERGENCE 4" was the tile list and it is gone). Do not "finish the job" on any
         of them without reading the reason.

         🔴 THE CARD CHROME IS UNCONDITIONAL. Every branch below renders INSIDE it, so a card that
         is briefly empty still tells the user WHICH panel is thinking. The count is appended only
         once the wire has answered — see `cardTitle` in the JS for why a premature "(0)" is a claim
         this card may not make. -->
    <lightning-card icon-name="standard:feedback">
        <span slot="title">{cardTitle}</span>

        <!-- ═══════════════════════════════════════════════════════════════════════════════════
             THE OPENER — IN THE CARD'S ACTIONS SLOT, EXACTLY AS `c/loiCounterOffer` PLACES ITS
             "Add" BUTTON.
             ═══════════════════════════════════════════════════════════════════════════════════
             ⚠ DIVERGENCE 1 — loiCounterOffer keeps its Add button MOUNTED and merely
             `disabled={editing}` while its form is open. This one is UNRENDERED while the form is
             open, because that is existing BEHAVIOUR, not styling: a Jest test pins "the opener is
             replaced by the form, not shown beside it", and the brief for this pass was explicitly
             "theming, not a rewrite". Hiding vs disabling is a behavioural choice and was left
             alone.
             It is also hidden entirely for a persona who may not create — see `canLog` in the JS:
             a Save button that is always refused is worse than no button. Both conditions live in
             `showOpener` because a slotted element cannot sit inside the body's if/else chain. -->
        <template lwc:if={showOpener}>
            <lightning-button
                slot="actions"
                data-open
                label="Add"
                icon-name="utility:add"
                onclick={handleOpenForm}
            ></lightning-button>
        </template>

        <!-- ONE padded body wrapper for every branch, including the error — loiCounterOffer's
             shape. The error used to carry its own `slds-p-around_medium` from outside this
             wrapper; inside it that would double up. -->
        <div class="slds-p-horizontal_small slds-p-bottom_small">
            <!-- ERROR: visible and loud. The controller THROWS rather than returning an empty
                 context precisely so this branch exists — a silent blank card on a sale with three
                 logged responses is a confident wrong answer nothing on the page contradicts.
                 `lv-error` is the ONE genuinely cross-bundle class in this repo (shared with
                 recentLeads / recentOpportunities / renewalList / competingBrokerSubmissions /
                 dispositionBuyerTimeline) — do not rename it.
                 ⚠ DIVERGENCE 2 — loiCounterOffer prefixes its server message with a lead-in
                 ("Counter offers could not be loaded: {msg}"). NOT ADOPTED: this component's own
                 fallback message already names the card ("Couldn't load the release materials
                 responses."), so the lead-in would render the same sentence twice in a row. The
                 `slds-text-color_error` + `slds-p-vertical_x-small` treatment IS adopted. -->
            <template lwc:if={hasError}>
                <p
                    class="lv-error rmr-error slds-text-color_error slds-p-vertical_x-small"
                    role="alert"
                >
                    {errorMessage}
                </p>
            </template>

            <template lwc:else>
                <!-- 🔴 "SAY SO IN THE HEADER" (user instruction, 2026-08-24). A sale with no
                     appointed broker is a state the user needs to know about BEFORE deciding to
                     log, because every response recorded now is recorded without one.
                     ⚠ IT IS SUPPRESSED WHILE THE FORM IS OPEN, because the form carries the same
                     fact in its own "Response from" block — see below. Rendering both at once
                     would be the same sentence twice on one small card, which reads as an error
                     rather than as emphasis. `role="status"` and not `alert`: no broker having
                     been appointed yet is a normal stage of a sale, not a problem.
                     Muted body text (`slds-text-color_weak`) — the same treatment loiCounterOffer
                     gives its "Set a Primary LOI on this deal…" line, which is the same kind of
                     sentence: a fact about the deal, not a failure. -->
                <template lwc:if={showNoBrokerNotice}>
                    <p
                        class="slds-text-color_weak slds-p-vertical_x-small"
                        data-no-broker-notice
                        role="status"
                    >
                        No broker is appointed on this sale yet. Responses logged now are
                        recorded without one.
                    </p>
                </template>

                <!-- ═══════════════════════════════════════════════════════════════════════════
                     THE FORM. Closed by default; opened by the header button above.
                     `slds-box slds-box_x-small slds-m-bottom_small` is loiCounterOffer's entry
                     form container, adopted verbatim — it replaces a hand-rolled `.rmr-form` rule
                     that re-implemented the same border, radius and padding with raw hooks.
                     ═══════════════════════════════════════════════════════════════════════════
                     🔴 FIELD ORDER IS THE REQUIREMENT, NOT A LAYOUT PREFERENCE: Method,
                     Response from, Notes (user instruction, 2026-08-24), and it is pinned by a
                     Jest test that walks the RENDERED tree in document order. "Response from" is
                     second even though it is the only one of the three that is NOT a control.
                     ⚠ AN EARLIER DRAFT PUT IT ABOVE THE FORM — "it is a fact about the sale, not a
                     field of the entry" — WHICH RENDERED Response from, Method, Notes AND WAS
                     WRONG. The order test caught it. Do not move it back out.
                     🔴 NO `lightning-record-edit-form`. The broker is resolved SERVER-SIDE at save
                     time and is never sent by the client, so there is no `Broker__c` field to put
                     in a form's field set; and an LDS form would FLS-check every key in its
                     payload, silently dropping a programmatic one WITH A SUCCESS TOAST. The write
                     is imperative Apex through a service that owns the resolution. -->
                <template lwc:if={isFormOpen}>
                    <div class="slds-box slds-box_x-small slds-m-bottom_small" data-form>
                        <lightning-combobox
                            data-method
                            label="Method"
                            placeholder="How did this response arrive?"
                            options={methodOptions}
                            value={method}
                            required
                            onchange={handleMethodChange}
                        ></lightning-combobox>

                        <!-- ═══════════════════════════════════════════════════════════════════
                             THE APPOINTED BROKER — RESOLVED, DISPLAYED, NEVER PICKED.
                             ═══════════════════════════════════════════════════════════════════
                             ⚠ DIVERGENCE 3 — loiCounterOffer has no read-only field, so it offers
                             no idiom to copy for one. Rather than invent a third, this uses SLDS's
                             OWN read-only form-element shape (`slds-form-element` +
                             `__label` / `__static` / `__help`), which is what makes this block
                             read as a sibling of the combobox and textarea above and below it
                             instead of as free-floating text. The `.rmr-readonly-*` classes are
                             KEPT alongside: they are the hooks the field-order Jest test walks.
                             🔴 RENDERED AS TEXT RATHER THAN AS A DISABLED LOOKUP, for the reason
                             `c/dispositionLogOfferModal` records for the same value: a disabled
                             lookup still looks like a control somebody may enable, and there is
                             no case in which this value should be hand-picked. User decision
                             2026-08-24, "lookup to the appointed broker only" — there is exactly
                             ONE right answer per sale, so a picker would be a control with one
                             correct option and several wrong ones.
                             🔴 AND IT IS NOT AN INPUT AT ALL: nothing here is sent to the server.
                             `saveResponse` takes no broker argument, so the resolution happens
                             again at save time and a stale value on an open form cannot be
                             submitted. -->
                        <div class="slds-form-element slds-m-top_x-small" data-broker>
                            <span class="rmr-readonly-label slds-form-element__label">Response from</span>
                            <template lwc:if={hasBroker}>
                                <p class="rmr-readonly-value slds-form-element__static">
                                    {brokerName}
                                </p>
                                <p class="rmr-readonly-help slds-form-element__help">
                                    {brokerSource}
                                </p>
                            </template>

                            <!-- 🔴 THE NO-BROKER BRANCH DOES NOT REFUSE THE FORM, AND THAT IS
                                 THE DELIBERATE DIFFERENCE FROM c/dispositionLogOfferModal, WHICH
                                 DOES. User instruction 2026-08-24: "If no broker is resolvable,
                                 still allow the entry with a blank broker rather than blocking the
                                 log." An offer naming nobody cannot be attributed or chosen
                                 between; "a decision came back on the 3rd" is a complete and
                                 useful record on its own.
                                 ⚠ BUT IT MUST SAY SO. A blank value under a "Response from" label
                                 is indistinguishable from a rendering failure, so this states the
                                 absence in words AND names where a broker would come from — the
                                 same source line the resolved branch shows, which is what makes
                                 it actionable rather than merely honest. -->
                            <template lwc:else>
                                <p
                                    class="rmr-readonly-value rmr-readonly-value_empty slds-form-element__static"
                                    data-no-broker
                                >
                                    No broker appointed yet
                                </p>
                                <p class="rmr-readonly-help slds-form-element__help">
                                    This response will be recorded without a broker.
                                    {brokerSource}.
                                </p>
                            </template>
                        </div>

                        <lightning-textarea
                            class="slds-m-top_x-small"
                            data-notes
                            label="Notes"
                            placeholder="The question asked, the decision given, or the offer terms."
                            max-length="32768"
                            value={notes}
                            onchange={handleNotesChange}
                        ></lightning-textarea>

                        <!-- loiCounterOffer's button block, adopted verbatim: `slds-m-top_small`,
                             BRAND SAVE FIRST with `slds-m-right_x-small`, neutral Cancel second,
                             left-aligned. The old block was a right-aligned flex row with Cancel
                             first — the single loudest "different component family" tell on the
                             card. The right margin is an explicit utility, NOT a `gap`, precisely
                             because the compiler eats the whitespace between the two tags. -->
                        <div class="slds-m-top_small">
                            <!-- ⚠ `disabled={isSaveDisabled}` IS A GETTER, NOT A TEMPLATE
                                 EXPRESSION — LWC has no expressions in templates, and a
                                 client-side disable is an AFFORDANCE ONLY. The service refuses a
                                 blank or unknown method with its own authored message whatever
                                 this button does. -->
                            <lightning-button
                                class="slds-m-right_x-small"
                                data-save
                                variant="brand"
                                label="Save"
                                onclick={handleSave}
                                disabled={isSaveDisabled}
                            ></lightning-button>
                            <lightning-button
                                data-cancel
                                variant="neutral"
                                label="Cancel"
                                onclick={handleCancel}
                                disabled={isSaving}
                            ></lightning-button>
                        </div>
                    </div>
                </template>

                <!-- ═══════════════════════════════════════════════════════════════════════════
                     WHAT HAS ALREADY BEEN LOGGED — NEWEST FIRST, IN `c-list-datatable`.
                     ═══════════════════════════════════════════════════════════════════════════
                     🔴 THIS IS loiCounterOffer's OWN HISTORY COMPONENT, ADOPTED 2026-08-25. The
                     block that used to sit here was a `<ul>` of hand-rolled tiles, and it carried
                     a comment headed "DIVERGENCE 4, AND THE BIG ONE" giving two reasons not to
                     use the datatable. BOTH ARE RETRACTED, and the second was FACTUALLY WRONG:

                       RETRACTED: "A fixed-column table does not survive the ~340px record-page
                       sidebar."

                     🔴 THIS CARD IS NOT IN THE SIDEBAR AND NEVER HAS BEEN. It is rendered by
                     `c/dispositionMain`, which is a componentInstance of the **`main`** region of
                     `flexipages/Disposition_Record_Page` — the wide one. The `sidebar` region
                     holds `dispositionSidebar`. DO NOT RE-USE THE WIDTH ARGUMENT.
                     The full retraction, and the two things deliberately NOT copied from
                     loiCounterOffer (sortable columns, and a `url`-type first column), are in the
                     JS class header. The columns themselves are `COLUMNS` there.

                     ⚠ THE ORDER IS THE SERVER'S. `ReleaseMaterialsResponseSelector` orders
                     `Entry_DateTime__c DESC NULLS LAST, Name DESC`, this component does NOT
                     re-sort, and NO COLUMN IS `sortable` — so the datatable offers no affordance
                     that would put a second, disagreeing sort on the same rows.

                     ⚠ ONE HONEST COST OF THE MOVE, RECORDED SO NOBODY REPORTS IT AS COVERAGE:
                     sfdx-lwc-jest stubs `lightning/datatable` with an EMPTY template, and
                     `c-list-datatable` is a subclass of it — so nothing inside this element
                     renders under Jest, and every `textContent` assertion the tiles supported is
                     now unavailable. The tests assert the `data` and `columns` PROPERTIES of this
                     rendered element instead, which is the same technique the file already used
                     for `lightning-combobox.options`. `@sa11y/jest` likewise sees an empty stub
                     here; the table's own a11y comes from the base component, not from us. -->
                <template lwc:if={hasEntries}>
                    <c-list-datatable
                        data-log
                        key-field="id"
                        data={rows}
                        columns={columns}
                        hide-checkbox-column
                        show-row-number-column
                    ></c-list-datatable>
                </template>

                <!-- EMPTY. loiCounterOffer's idiom is ONE muted line of body text
                     (`slds-text-color_weak slds-p-vertical_x-small`), not a centred icon column —
                     the icon/headline/subtext stack was the second loudest "different family"
                     tell, and it is gone.
                     ⚠ THE EXPLANATORY SECOND LINE IS KEPT (loiCounterOffer has only the one).
                     Deleting user-facing text that says WHERE the rows come from is a content
                     change, not a theming one, and it was not in scope. Both lines are muted body
                     text, so the block still reads as one quiet sentence-pair rather than as a
                     designed empty state.
                     A STATUS, not an alert: nothing having come back yet is the ordinary state of
                     a sale the day materials go out. -->
                <template lwc:elseif={isEmpty}>
                    <div class="rmr-empty slds-p-vertical_x-small" role="status">
                        <p class="rmr-empty-text slds-text-color_weak">No responses yet</p>
                        <p class="rmr-empty-sub slds-text-color_weak">
                            Rows appear here as brokers respond to the released materials.
                        </p>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
