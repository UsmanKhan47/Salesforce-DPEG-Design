<template>
    <lightning-card>
        <div slot="title" class="hdr">
            <span class="hdr-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A9ED4"
                    stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M12 7v5l3 2" />
                </svg>
            </span>
            <span class="hdr-title">Meter Register ({count})</span>
        </div>

        <div slot="actions">
            <lightning-button
                class="mr-capture"
                label="Capture Meters"
                icon-name="utility:add"
                onclick={handleCapture}
            ></lightning-button>
        </div>

        <template lwc:if={error}>
            <div
                class="slds-p-around_x-small slds-text-color_error slds-grid slds-grid_vertical-align-center"
                role="alert"
            >
                <lightning-icon
                    icon-name="utility:error"
                    size="x-small"
                    variant="error"
                    alternative-text="Error"
                    class="slds-m-right_x-small"
                ></lightning-icon>
                <span>{errorMessage}</span>
            </div>
        </template>

        <template lwc:if={hasMeters}>
            <c-list-datatable
                key-field="id"
                data={rows}
                columns={columns}
                column-widths-mode="fixed"
                hide-checkbox-column
            ></c-list-datatable>
        </template>

        <template lwc:else>
            <p class="mr-empty">
                No meters recorded for this property yet. Use Capture Meters to record the
                meter number, utility account and service identifier for each space - the
                meter number is what an incoming tenant is given at move-in.
            </p>
        </template>

        <div slot="footer" class="view-all-footer">
            <a href={listUrl} onclick={viewAll}>View All Meters</a>
        </div>
    </lightning-card>
</template>
