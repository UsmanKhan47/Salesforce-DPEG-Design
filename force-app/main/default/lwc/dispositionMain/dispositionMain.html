<template>
    <template if:true={hasError}>
        <div class="wire-error" role="alert">
            <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
            <span>This disposition could not be loaded: {errorMessage}</span>
        </div>
    </template>
    <template if:true={isBovOutreach}>
        <!--
          ═══════════════════════════════════════════════════════════════════════════════
          🔴 ONE TAG, NOT TWO — REPLACED 2026-08-24 (SAME DAY, LATER).
          ═══════════════════════════════════════════════════════════════════════════════
          This branch mounted `<c-bov-comparison-matrix>` TWICE: once with
          `preferred-only hide-actions` (the "Preferred Broker" card) and once bare (the
          matrix), with the three broker buttons living on the matrix instance's own card
          header. `c/bovBrokerPanel` now wraps both, so ONE header carries "Add Broker
          Response", "Replace Broker" and "Add Preferred Broker" above BOTH cards. The two
          children keep their own section titles — user decision.

          ⚠ THE TWO CHILD TAGS STILL EXIST; THEY MOVED INSIDE THE PANEL. Read
          `bovBrokerPanel.html` before changing anything about which cards render here:
          the order (preferred ABOVE the matrix) and the bare `preferred-only` attribute
          are both requirements, and both now live there.

          🔴 THE GAP DEFECT THIS FILE'S STYLESHEET DOCUMENTED IS FIXED BY THE MOVE, NOT
          WORKED AROUND. The comment in dispositionMain.css read "KNOWN, ACCEPTED: … with
          no preferred broker the matrix sits one gap lower than the top of the region",
          because the preferred instance self-gated to nothing and a zero-height flex item
          still takes a gap. `c/bovBrokerPanel` holds the BOV rows (its three buttons'
          visibility rules need them anyway), so it can gate the TAG with `lwc:if` — and
          an unrendered tag is not a flex item. This router still has no BOV data of its
          own and still must not acquire any.

          ⚠ THE PANEL IS `isExposed=false`, LIKE THE MATRIX BEFORE IT. It is composed here
          in markup, not placed in App Builder.
        -->
        <c-bov-broker-panel record-id={recordId}></c-bov-broker-panel>
    </template>
    <!--
      RELEASE MATERIALS (2026-08-24). The response logger — what came back after the
      offering materials went out.

      🔴 THIS TAG IS THE ONLY WAY TO CREATE A `Release_Materials_Response__c`. The object
      ships with NO TAB and NO LIST VIEW by design, so removing this line does not hide a
      feature — it deletes the only route to it. (Contrast the call-for-offers removal
      below, where the bundle was kept and only the render was dropped.)

      ⚠ THE STAGE GATE IS HERE AND NOWHERE ELSE. `ReleaseMaterialsResponseService`
      deliberately has NO save-time stage check: `Entry_DateTime__c` exists so a response
      that arrived earlier can be BACKDATED, and a server-side stage rule would refuse
      exactly that. This is a render gate, not a business rule.

      ⚠ THE CARD GATES ITS OWN FORM. There is no permission test around this tag: the
      component reads `canLog` off its own context and renders the list without an opener
      for a read-only persona. Gating it here would mean this component describing an
      object it otherwise has no reason to know about.
    -->
    <template if:true={isReleaseMaterials}>
        <c-release-materials-response-log
            record-id={recordId}
        ></c-release-materials-response-log>
    </template>
    <template if:true={isActiveListing}>
        <c-broker-listing record-id={recordId}></c-broker-listing>
        <!--
          🔴 NO CALL-FOR-OFFERS CARD HERE. `<c-disposition-call-for-offers>` was rendered
          on this line and was REMOVED at UAT on 2026-08-21 ("also remove call for offers
          lwc, we don't need to show"). The bundle itself was deliberately KEPT — this is a
          render removal, not a deletion — so re-adding the tag is a one-line mistake that
          nothing but the absence pin in __tests__/dispositionMain.test.js would catch.

          ⚠ IF ANYONE EVER RE-ADDS A "CALL FOR OFFERS" CARD HERE, IT IS STILL NOT
          c-call-for-offers-list / c-call-for-offers-panel. Those two are OPPORTUNITY-scoped
          (the acquisitions buy-side call for offers) and remain out of scope for the
          disposition module. The name collision is real: "call for offers" means one thing
          when DPEG is buying and another when DPEG is selling. Do not consolidate them.
          The pin asserts on the SUBSTRING 'call-for-offers', so it reds for all three tags.
        -->
        <div class="listing-row">
            <!--
              ⚠ record-id ADDED 2026-08-10 (Tranche 5B). It was the ONLY child on this page
              without it — harmless while c-listing-alerts was a static mock, and fatal the
              moment it reads anything. Do not remove it: the traction panel has no other
              route to the Disposition.
            -->
            <c-listing-alerts record-id={recordId}></c-listing-alerts>
            <c-backup-brokers record-id={recordId}></c-backup-brokers>
        </div>
    </template>
    <template if:true={isClosing}>
        <!--
          ═══════════════════════════════════════════════════════════════════════════════
          🔴 THE WIRE FIELDS ONLY. NO CLOSING CHECKLIST HERE (removed 2026-08-24).
          ═══════════════════════════════════════════════════════════════════════════════
          `<c-disposition-closing-tasks>` was rendered on the line below this one and was REMOVED
          at the user's request ("drop the checklist, keep the wire fields"). It is the card
          titled "Closing Checklist" — the PSA / Title Company / Closing Statement task list
          backed by `DispositionTaskController`.

          🔴 A RENDER REMOVAL, NOT A DELETION — SAME TREATMENT AS THE CALL-FOR-OFFERS CARD ABOVE.
          The `lwc/dispositionClosingTasks` bundle, `DispositionTaskController` and its tests are
          all KEPT. Re-adding the tag is a one-line mistake that nothing but the absence pin in
          __tests__/dispositionMain.test.js would catch.

          ⚠ THIS TAG WAS THE ONLY ROUTE TO THAT CARD, AND THAT IS NOW A DEAD BUNDLE, NOT A HIDDEN
          ONE. `dispositionClosingTasks.js-meta.xml` is `isExposed=false`, so it is not placeable
          in App Builder; a repo-wide search on 2026-08-24 found this line and its own tests as
          the only references. Reviving it means restoring a tag, not just a FlexiPage region.

          🔴 WHAT MUST NOT FOLLOW IT OUT. `c-wire-verification` below is the ONLY editable route
          to the six `Wire__c` confirmation fields, which is what drives
          `Disposition__c.Wire_Verification_Completed__c` (a DERIVED field, maintained by the
          `Wire_Verification_Rollup` flow — it cannot be typed in). That flag gates the Send
          Closing Approval action AND the `Wire_Complete_Before_Sale_Closes` validation rule on
          the final hop. Remove this card and the Closing stage becomes a dead end with no error
          message. FLS verified against the org on 2026-08-24: all six fields are
          readable+EDITABLE in DPEG_Disposition_Edit.
        -->
        <c-wire-verification record-id={recordId}></c-wire-verification>
    </template>
</template>
