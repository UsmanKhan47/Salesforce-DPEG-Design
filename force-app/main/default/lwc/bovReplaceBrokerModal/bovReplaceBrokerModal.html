<template>
    <lightning-modal-header label={headerLabel}></lightning-modal-header>

    <lightning-modal-body>
        <div class="brb-body slds-is-relative">
            <template lwc:if={isSaving}>
                <lightning-spinner
                    alternative-text={savingText}
                    size="small"
                ></lightning-spinner>
            </template>

            <template lwc:if={hasOptions}>
                <!-- ═══════════════════════════════════════════════════════════════════════════
                     🔴 THE TWO MODE INTRO NOTES WERE REMOVED ON 2026-08-21 (UAT prose removal).
                     ═══════════════════════════════════════════════════════════════════════════
                     `.brb-note` / `.brb-note_info` carried one sentence per mode describing what
                     the action does ("<incumbent> moves back to Backup and the broker you choose
                     becomes Selected. The broker approval is cleared by this change." /
                     "The broker you choose becomes this sale's Selected broker. They must still
                     be approved…"). The user asked for exactly this class of copy to go.

                     🔴 WHAT DID **NOT** GO, AND MUST NOT: the SERVER'S returned warning. That
                     sentence is authored by `BovSubmissionService.replaceSelectedBroker`, handed
                     out of here untouched by `close({ message })`, and raised as a sticky toast by
                     c/bovComparisonMatrix. It was never rendered in this template and nothing
                     here may re-author it — see the class header.

                     ⚠ ONE CONSEQUENCE, RECORDED SO IT IS A DECISION AND NOT AN OVERSIGHT: the
                     replacement note was the only surface naming the INCUMBENT broker, so this
                     dialog no longer says who is being replaced. The modal is only ever opened
                     from c/bovComparisonMatrix, which shows the Selected row immediately behind
                     it. `@api currentBroker` is still accepted (the matrix passes it) but is no
                     longer rendered; if the name is wanted back, it belongs as a plain
                     label/value pair, NOT as a restored sentence. -->
                <lightning-radio-group
                    class="brb-options slds-m-top_small"
                    name="backupSubmission"
                    label="Incoming broker"
                    options={options}
                    value={newSubmissionId}
                    onchange={handleSelection}
                    type="radio"
                    required
                ></lightning-radio-group>

                <!-- Reason is REQUIRED and its options come from getPicklistValues — never from a
                     hardcoded array. See the component header.

                     On a FIRST APPOINTMENT the combobox is not rendered at all: every other value
                     presupposes a predecessor, so there is nothing to choose. What WILL be recorded
                     is stated instead, so the history value is disclosed rather than applied
                     silently. -->
                <template lwc:if={showReasonPicker}>
                    <lightning-combobox
                        class="brb-reason slds-m-top_small"
                        name="reason"
                        label="Reason for the change"
                        placeholder="Choose a reason"
                        options={reasonOptions}
                        value={reason}
                        onchange={handleReasonChange}
                        required
                    ></lightning-combobox>
                </template>
                <template lwc:else>
                    <!-- Bound, not typed: the literal has ONE home (the module
                         constant) so the disclosure cannot end up naming a value
                         different from the one actually sent to Apex.
                         🔴 KEPT THROUGH THE 2026-08-21 PROSE REMOVAL, DELIBERATELY. This is not
                         copy describing what the action does — it is the DISCLOSURE OF A VALUE
                         being written to an append-only history, standing in for the combobox
                         that is hidden on a first appointment. Deleting it would write a
                         `Reason__c` the user was never shown.
                         ⚠ `as <strong>` IS ON ONE SOURCE LINE ON PURPOSE. The LWC template
                         compiler drops the trailing whitespace of a text node that ENDS a line
                         before an inline element, so breaking after "as" renders
                         "…history asInitial Appointment" — measured in this repo, and a
                         `.replace(/\s+/g,' ')` in a test cannot recover it because the space is
                         gone from the DOM. Pinned by a rendered-text assertion in the suite. -->
                    <p class="brb-fixed-reason slds-m-top_small">
                        Recorded in the broker change history
                        as <strong>{effectiveReason}</strong>.
                    </p>
                </template>

                <template lwc:if={reasonLoadError}>
                    <div
                        class="lv-error slds-text-color_error slds-m-top_x-small"
                        role="alert"
                    >
                        {reasonLoadError}
                    </div>
                </template>

                <lightning-textarea
                    class="brb-notes slds-m-top_small"
                    name="notes"
                    label="Notes (optional)"
                    placeholder="Anything the next reader of this sale should know."
                    value={notes}
                    onchange={handleNotesChange}
                    max-length="32768"
                ></lightning-textarea>

                <template lwc:if={error}>
                    <div
                        class="lv-error slds-text-color_error slds-m-top_small"
                        role="alert"
                    >
                        {error}
                    </div>
                </template>
            </template>

            <template lwc:else>
                <p class="brb-empty">{emptyMessage}</p>
            </template>
        </div>
    </lightning-modal-body>

    <lightning-modal-footer>
        <lightning-button
            class="brb-cancel"
            label="Cancel"
            onclick={handleCancel}
        ></lightning-button>
        <template lwc:if={hasOptions}>
            <lightning-button
                class="brb-confirm slds-m-left_x-small"
                variant="brand"
                label={confirmLabel}
                onclick={handleConfirm}
                disabled={confirmDisabled}
            ></lightning-button>
        </template>
    </lightning-modal-footer>
</template>
