<template>
    <article class="ps-card">
        <!-- Header -->
        <div class="ps-hd">
            <span class="ps-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#132850"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/>
                </svg>
            </span>
            <span class="ps-title">Portfolio Status (last 5 years)</span>
        </div>

        <!-- Donut + readout -->
        <div class="ps-top">
            <div class="ps-donut-wrap">
                <svg width="112" height="112" viewBox="0 0 120 120">
                    <!-- neutral track -->
                    <circle cx="60" cy="60" r="50" fill="none" stroke="#EBEBEB" stroke-width="13"/>
                    <!-- active arc -->
                    <circle cx="60" cy="60" r="50" fill="none" stroke="#22A652" stroke-width="13"
                            stroke-linecap="round"
                            stroke-dasharray={dash}
                            transform="rotate(-90 60 60)"/>
                </svg>
                <div class="ps-center">
                    <span class="ps-pct">{pct}%</span>
                    <span class="ps-act-lbl">Active</span>
                </div>
            </div>
            <div class="ps-readout">
                <div class="ps-rd-label">Active listings</div>
                <div class="ps-rd-nums">
                    <span class="ps-rd-active">{active}</span>
                    <span class="ps-rd-total"> / {total}</span>
                </div>
                <div class="ps-rd-sub">broker-property records</div>
            </div>
        </div>

        <!-- Stacked status bar -->
        <div class="ps-bar">
            <template for:each={segments} for:item="s">
                <div key={s.key} style={s.barStyle}></div>
            </template>
        </div>

        <!-- Legend -->
        <div class="ps-legend">
            <template for:each={segments} for:item="s">
                <div key={s.key} class="ps-leg-row">
                    <span style={s.dotStyle}></span>
                    <span class="ps-leg-lbl">{s.label}</span>
                    <span class="ps-leg-cnt">{s.count}</span>
                </div>
            </template>
        </div>
    </article>
</template>
