<template>
    <div class="card">
        <div class="section-header">Listing Traction</div>

        <template if:true={hasError}>
            <div class="wire-error" role="alert">
                <lightning-icon
                    icon-name="utility:error"
                    size="x-small"
                    variant="error"
                ></lightning-icon>
                <span>Listing traction could not be loaded: {errorMessage}</span>
            </div>
        </template>

        <template if:true={isLoading}>
            <div class="loading-msg">Loading listing traction…</div>
        </template>

        <template if:true={hasTraction}>
            <div class="band-row">
                <span class={badgeClass}>{traction.label}</span>
            </div>
            <p class="band-detail">{traction.detail}</p>

            <template if:true={traction.isListed}>
                <div class="clock-track">
                    <div class={clockBarClass} style={clockBarStyle}></div>
                </div>
            </template>

            <dl class="milestone-list">
                <template for:each={milestones} for:item="m">
                    <div key={m.key} class="milestone-row">
                        <dt class="milestone-term">{m.term}</dt>
                        <dd class="milestone-value">
                            <span class="milestone-primary">{m.value}</span>
                            <span class="milestone-note">{m.note}</span>
                        </dd>
                    </div>
                </template>
            </dl>
        </template>
    </div>
</template>
