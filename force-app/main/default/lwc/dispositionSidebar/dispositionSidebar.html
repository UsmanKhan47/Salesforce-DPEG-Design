<template>
    <template if:true={hasError}>
        <div class="wire-error" role="alert">
            <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
            <span>This disposition could not be loaded: {errorMessage}</span>
        </div>
    </template>
    <template if:true={isBovOutreach}>
        <c-bov-outreach record-id={recordId}></c-bov-outreach>
    </template>
    <!--
      ═══════════════════════════════════════════════════════════════════════════════
      🔴 ONE TAG, TWO MODES — THE STAGE DECISION IS MADE HERE (2026-08-24; 2026-08-25).
      ═══════════════════════════════════════════════════════════════════════════════
      From `Offer Selection` onwards — `Offer Selection`, `LOI`, `PSA` and `Closing` — the card
      shows ONLY the offer that was put forward (`Is_Selected__c = true`) and its "+ Log Offer"
      button is HIDDEN. At the two offer-ARRIVAL stages, `Active Listing` (on-market) and
      `Release Materials` (off-market), it lists every offer with the button available.

      🔴 TWO RETRACTIONS IN THIS BLOCK — DO NOT QUOTE AN OLDER REVISION OF IT.
        • It used to say selected-only applied "At `Offer Selection`" alone and that the
          other THREE offer stages listed everything. The user extended the mode to LOI, PSA
          and Closing on 2026-08-25; PSA and Closing did not render the card at all before.
        • It used to say "+ Log Offer" was DISABLED in that mode. It is HIDDEN — see
          `c/dispositionOffer`'s `showLogOffer`. The button was never rendered disabled.

      🔴 A BOUND GETTER, NOT A BARE ATTRIBUTE, AND NOT A SECOND `<template>` BRANCH.
        • `selected-only` bare would pass boolean `true` unconditionally — wrong at the two
          arrival stages.
        • `selected-only=""` passes the EMPTY STRING, which is FALSY. The child reads
          `=== true`, so that one character silently restores the old behaviour with nothing
          on the page to show it. Binding a real boolean getter makes both typos impossible.
        • A second `<template if:true={isSelectedOfferOnlyStage}>` branch would mean two tags
          to keep in step, and `querySelector` in the tests could not tell which one rendered.

      ⚠ THE STAGE LIST STAYS IN ONE PLACE, AND THE JS NOW GUARANTEES IT.
      `isSelectedOfferOnlyStage` is a NARROWING of `isOfferStage`, not a parallel list: the
      render set is BUILT by spreading the selected-only set, so a stage cannot be in the
      narrower one without being in the wider one. That is structural, not a convention held
      by a test. See `SELECTED_OFFER_ONLY_STAGES` in the JS.

      ⚠ AT `Closing` THIS CARD AND `<c-disposition-closing>` BOTH RENDER. The branches below
      are independent and always have been; two cards there is the requested behaviour.

      🔴 AND `isOfferStage` IS NOW RECORD-TYPE AWARE (2026-08-25). `Release Materials` is a
      stage on BOTH record types but only means "offers arrive here" OFF-market, so the card
      no longer renders there on an On_Market sale — confirmed live on DISP-0023. The record
      type rides on the SAME `getRecord` wire that already reads the stage. There is still
      exactly ONE `<c-disposition-offer>` tag: the scoping is in the getter, not a second
      branch here, for the same reason the mode flag is a bound getter and not a second tag.
    -->
    <template if:true={isOfferStage}>
        <c-disposition-offer
            record-id={recordId}
            selected-only={isSelectedOfferOnlyStage}
        ></c-disposition-offer>
    </template>
    <template if:true={isClosing}>
        <c-disposition-closing record-id={recordId}></c-disposition-closing>
    </template>
</template>
