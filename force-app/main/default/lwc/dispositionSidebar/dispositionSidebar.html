<template>
    <template if:true={hasError}>
        <div class="wire-error" role="alert">
            <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
            <span>This disposition could not be loaded: {errorMessage}</span>
        </div>
    </template>
    <template if:true={isBovOutreach}>
        <c-bov-outreach record-id={recordId}></c-bov-outreach>
    </template>
    <!--
      ═══════════════════════════════════════════════════════════════════════════════
      🔴 ONE TAG, TWO MODES — THE STAGE DECISION IS MADE HERE (2026-08-24).
      ═══════════════════════════════════════════════════════════════════════════════
      At `Offer Selection` the card shows ONLY the offer that was put forward for approval
      (`Is_Selected__c = true`) and its "+ Log Offer" button is DISABLED. At the other three
      offer stages it lists every offer with the button enabled, exactly as before.

      🔴 A BOUND GETTER, NOT A BARE ATTRIBUTE, AND NOT A SECOND `<template>` BRANCH.
        • `selected-only` bare would pass boolean `true` unconditionally — wrong at three of
          the four stages.
        • `selected-only=""` passes the EMPTY STRING, which is FALSY. The child reads
          `=== true`, so that one character silently restores the old behaviour with nothing
          on the page to show it. Binding a real boolean getter makes both typos impossible.
        • A second `<template if:true={isOfferSelection}>` branch would mean two tags to keep
          in step, and `querySelector` in the tests could not tell which one rendered.

      ⚠ THE STAGE LIST STAYS IN ONE PLACE. `isOfferSelection` is a NARROWING of
      `isOfferStage`, not a parallel list. The 2026-08-25 record-type work left that intact —
      'Offer Selection' is on BOTH record types and is the one offer stage NOT scoped — and
      the invariant is held by a sweep test over the whole stage × record-type grid rather
      than by an `&&` that could never be false. See the JS.

      🔴 AND `isOfferStage` IS NOW RECORD-TYPE AWARE (2026-08-25). `Release Materials` is a
      stage on BOTH record types but only means "offers arrive here" OFF-market, so the card
      no longer renders there on an On_Market sale — confirmed live on DISP-0023. The record
      type rides on the SAME `getRecord` wire that already reads the stage. There is still
      exactly ONE `<c-disposition-offer>` tag: the scoping is in the getter, not a second
      branch here, for the same reason the mode flag is a bound getter and not a second tag.
    -->
    <template if:true={isOfferStage}>
        <c-disposition-offer
            record-id={recordId}
            selected-only={isOfferSelection}
        ></c-disposition-offer>
    </template>
    <template if:true={isClosing}>
        <c-disposition-closing record-id={recordId}></c-disposition-closing>
    </template>
</template>
