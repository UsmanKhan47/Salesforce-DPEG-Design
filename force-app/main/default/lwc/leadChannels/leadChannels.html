<template>
    <template if:true={data}>
        <div class="card">
            <div class="card-header">
                <div class="card-title">Lead Channels</div>
            </div>
            <div class="cards-grid">
                <template for:each={stats} for:item="stat">
                    <c-onboarding-card-child
                        key={stat.key}
                        value={stat.value}
                        label={stat.label}
                        icon-name={stat.iconName}
                        icon-color={stat.iconColor}>
                    </c-onboarding-card-child>
                </template>
            </div>
        </div>
    </template>
</template>
