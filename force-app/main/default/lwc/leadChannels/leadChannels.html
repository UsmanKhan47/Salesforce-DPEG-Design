<template>
    <template if:true={hasError}>
        <div class="wire-error" role="alert">
            <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
            <span>Lead channels could not be loaded: {errorMessage}</span>
        </div>
    </template>
    <template if:true={data}>
        <div class="card">
            <div class="card-header">
                <div class="card-title">Lead Channels</div>
            </div>
            <div class="cards-grid">
                <template for:each={stats} for:item="stat">
                    <c-onboarding-card-child
                        key={stat.key}
                        value={stat.value}
                        label={stat.label}
                        icon-name={stat.iconName}
                        icon-color={stat.iconColor}>
                    </c-onboarding-card-child>
                </template>
            </div>
        </div>
    </template>
</template>
