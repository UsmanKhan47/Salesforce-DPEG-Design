<template>
    <lightning-card icon-name="standard:home">
        <span slot="title">Properties In Onboarding ({count})</span>
        <template lwc:if={error}>
            <div class="slds-p-horizontal_small slds-p-bottom_small slds-text-color_error slds-grid slds-grid_vertical-align-center" role="alert">
                <lightning-icon icon-name="utility:error" size="x-small" variant="error" class="slds-m-right_x-small"></lightning-icon>
                <span>{errorMessage}</span>
            </div>
        </template>
        <c-list-datatable
            key-field="id"
            data={rows}
            columns={columns}
            column-widths-mode="fixed"
            hide-checkbox-column>
        </c-list-datatable>
        <div slot="footer" class="view-all-footer">
            <a href={listUrl} onclick={viewAll}>View All</a>
        </div>
    </lightning-card>
</template>
