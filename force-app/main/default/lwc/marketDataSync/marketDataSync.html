<!--
  marketDataSync — see marketDataSync.js for the full rationale. The SIX things this template must
  keep true, all of them argued at length in that header:

    1. the Last Synced row is labelled "Last Synced (manual)" and carries the helptext. Both are
       mitigations for a Sync button that contacts nothing — and both are MORE load-bearing since
       2026-08-17, because the card now shows 8-9 provider-named fields and a Sync Status picklist,
       i.e. it looks far more like a working integration than the four-field card it replaced.
    2. there is NO spinner and NO busy state anywhere in this file.
    3. an unsupported `source` renders a VISIBLE role="alert", never an empty card — and a deal with
       no linked Property renders a VISIBLE role="status", never a blank card and never an alert.
       🔴 The two roles are NOT interchangeable: alert is an administrator misconfiguration nothing
       else would ever report; status is an ordinary state the user can fix themselves.
    4. the Sync button is `variant="neutral"`. A brand button asserts a primacy this stub has not
       earned, and it would read as the primary action of the record page.
    5. 🔴 the record forms are bound to {propertyId} + Property__c, NOT to {recordId} + Opportunity.
       This card renders the deal's linked PROPERTY. See header section 2.
    6. 🔴 there are TWO forms and that is deliberate: metrics at mode="view" (inline-editable, since
       hand entry IS how these numbers get in) and the provider CONTROL field — `Sync Status` — at
       mode="readonly", because an editable `Sync Status` contradicts the button beside it. Code
       review C2. Do not merge them, and do not "simplify away" a form that now binds one field.
       ⚠ `Data Source` was in that readonly form for part of 2026-08-17 and was REMOVED from the
       card by user decision. The FIELD still exists on Property__c and is untouched — only the
       rendering is gone. Do not re-add it to "complete the block".

  ⚠ Do NOT apply the repo's `.lv-*` list-view chrome here. Measured: those table classes live in a
  single bundle, and this is a field section, not a list.
-->
<template>
    <template lwc:if={isConfigured}>
        <!--
          The outer card is UNCHANGED from the deployed version. Only the header inside it changes —
          the user accepted the surrounding container and reported the header alone, so the card stays
          exactly as it was rather than being swept up in the fix.
        -->
        <div class="slds-card mds-card">
        <div class={sectionClass}>
            <!--
              THE SLDS "EXPANDABLE SECTION" BLUEPRINT, REPRODUCED EXACTLY — this is what a native
              Dynamic Forms fieldSection renders, and matching it is the whole of "keep the design
              the same" at the heading level.

              The previous version used `slds-section__title slds-text-title_caps` with a
              lightning-icon, which rendered as small uppercase text ("PLACER") beside a coloured
              icon. The neighbouring native "Broker" section renders a full-width grey bar with a
              collapse chevron and a SENTENCE-CASE title, so the two did not read as the same
              construct. `slds-text-title_caps` is the utility-bar/caps treatment; it is not what a
              collapsible field section renders.

              🔴 THE WHOLE BAR IS THE BUTTON, as it is natively — not a chevron with a label beside
              it. `.slds-section__title-action` is what supplies the full width and the grey; the
              wrapper's `slds-is-open` is what rotates the chevron and reveals the content.

              🔴 NO SOURCE ICON. Dropped deliberately (user decision): the native "Broker" section
              has none, and an exact match was chosen over keeping the Placer/CoStar icons. The
              `iconName` key was removed from CONFIG_BY_SOURCE too rather than left as dead config
              that a later reader would try to re-render.
            -->
            <h3 class="slds-section__title">
                <button
                    class="slds-button slds-section__title-action mds-section-action"
                    type="button"
                    aria-expanded={ariaExpanded}
                    aria-controls="sectionContent"
                    onclick={handleToggleSection}
                >
                    <!--
                      utility:switch is the SLDS collapse chevron. It points right when closed and
                      SLDS rotates it 90 degrees via `.slds-is-open .slds-section__title-action-icon`,
                      so the rotation is driven by the wrapper class and needs no CSS here.
                      aria-hidden: the button is already named by the title text beside it.
                    -->
                    <lightning-icon
                        icon-name="utility:switch"
                        size="xx-small"
                        alternative-text=""
                        aria-hidden="true"
                        class="slds-section__title-action-icon slds-m-right_x-small"
                    ></lightning-icon>
                    <span class="slds-truncate mds-section-title" title={cardTitle}
                        >{cardTitle}</span
                    >
                </button>
            </h3>

            <div
                id="sectionContent"
                class={sectionContentClass}
                aria-hidden={ariaHidden}
            >
                <!--
                  The body is UNMOUNTED when collapsed, not merely styled away. In the org SLDS's own
                  `.slds-section__content` display rule would hide it, but "hidden from assistive
                  technology" must not depend on a stylesheet being present — and leaving focusable
                  controls inside an aria-hidden container is itself an accessibility defect. The
                  container survives so `aria-controls` always resolves to a real element.
                -->
                <template lwc:if={isOpen}>
                    <!--
                      🔴 BOTH FORMS RENDER THE **PROPERTY**, NOT THE OPPORTUNITY. `record-id` is the
                      Id resolved from this deal's Property__c lookup, and `object-api-name` is the
                      Property__c schema import — see marketDataSync.js header section 2 for why
                      lightning-record-form cannot render Property__r.* spanning fields, and why the
                      read-only alternative (lightning-formatted-* rows) was rejected.

                      lightning-record-form in mode="view" renders platform-identical field rows WITH
                      the per-field inline-edit pencils. lightning-output-field would have been closer
                      to pixel-identical but READ-ONLY — a functional regression, not a styling
                      choice. That argument was made against FOUR fields; it applies with more force
                      to the metrics rendered here.

                      ⚠ IT APPLIES TO THE **METRICS**, AND ONLY TO THEM. The two provider control
                      fields are deliberately read-only in the second form below — that is not the
                      regression this argument rejected, because nobody enters a Sync Status by hand:
                      it is a fact about a fetch, and no fetch exists. Editability follows what the
                      field is FOR, not a blanket rule.

                      🔴 THEY ARE MOUNTED ONLY WHEN A PROPERTY ID EXISTS. A lightning-record-form with
                      a null record-id renders a broken/empty form rather than nothing, so this guard
                      prevents a visible defect. They also stay UNMOUNTED while the Opportunity wire
                      is in flight, which is the "say nothing until you know" rule.
                    -->
                    <template lwc:if={showForm}>
                        <div class="slds-p-horizontal_small slds-p-top_x-small">
                            <lightning-record-form
                                class="mds-metrics"
                                record-id={propertyId}
                                object-api-name={objectApiName}
                                fields={metricFields}
                                columns="2"
                                mode="view"
                                density="comfy"
                            ></lightning-record-form>

                            <!--
                              🔴 A SECOND FORM, `mode="readonly"`, FOR THE PROVIDER CONTROL FIELD —
                              <source>_Fetch_Status__c, which since 2026-08-17 is the only entry in
                              `controlFields`. It is VISIBLE and NOT hand-editable. Code review C2.
                              The full argument is in the CONFIG_BY_SOURCE header of
                              marketDataSync.js; the short version:

                                an editable `Sync Status` CONTRADICTS the button below it. Press
                                Sync, read "marked as synced", watch Last Synced update — and see
                                `Not Synced` one row away, because nothing writes it and nothing
                                should. A user will "correct" that to `Success`, destroying the only
                                truthful in-record signal that no fetch ever happened.

                              ⚠ A SECOND FORM FOR ONE FIELD LOOKS LIKE SOMETHING TO TIDY AWAY. It is
                              not: `mode` is a property of the FORM, not of a field, so rendering one
                              field read-only beside eight editable ones requires exactly this. The
                              alternative — a hand-built row with lightning-output-field — loses the
                              platform's own picklist-label rendering and duplicates markup the form
                              already gives for free.

                              ⚠ `<source>_Data_Source__c` WAS the second entry here, for part of
                              2026-08-17, and was REMOVED FROM THE CARD by user decision ("there is
                              no need to add datasource field"). 🔴 The FIELD is untouched — it still
                              exists on Property__c with its FLS intact, is owned by another
                              workstream, and its flip to `Integrated` remains post-deploy gate G9.
                              Only the rendering went. Do not re-add it to "complete the block".

                              ⚠ `mode="readonly"` is NOT a permission control and must not be
                              described as one: FLS is still the only real gate, and this field
                              remains editable from the Property record page. What it removes is the
                              INVITATION — a pencil beside a value that contradicts the button.

                              ⚠ Same record-id, same object, same columns and density as the form
                              above, so the two read as ONE continuous field section in the FSD's own
                              order (metrics, then control). Do not merge them back together.
                            -->
                            <lightning-record-form
                                class="mds-controls"
                                record-id={propertyId}
                                object-api-name={objectApiName}
                                fields={controlFields}
                                columns="2"
                                mode="readonly"
                                density="comfy"
                            ></lightning-record-form>
                        </div>
                    </template>
                    <template lwc:elseif={showNoProperty}>
                        <!--
                          🔴 role="status", NOT role="alert". Only LeadConvertService links a
                          Property, so a manually-created deal simply has none — an ordinary,
                          expected state the user can fix by filling in the lookup. role="alert" is
                          reserved in this bundle for an ADMINISTRATOR MISCONFIGURATION that nothing
                          else in the org would ever report. Collapsing the two would train users to
                          ignore the alert that actually matters.

                          🔴 And it must NOT be a blank card: a hidden or empty card is
                          indistinguishable from "this org has no market data feature", which is the
                          same silent-absence defect the unsupported-source alert exists to prevent.

                          `showNoProperty` is false while the Opportunity wire is in flight AND when
                          that read was refused, so this note is never an assertion made before the
                          fact is in hand.
                        -->
                        <div
                            class="slds-p-horizontal_small slds-p-vertical_x-small"
                        >
                            <p class="mds-empty" role="status">
                                {noPropertyMessage}
                            </p>
                        </div>
                    </template>

                    <!--
                      The Last Synced row is suppressed ONLY in the no-property state, where there is
                      no field to read and "Never" would be an assertion about a record that does not
                      exist. It IS rendered while the wires are in flight (the em-dash) and when a
                      read was refused ("Not available") — in both of those the row's own three-way
                      rendering is the honest answer.
                    -->
                    <template lwc:if={showLastSynced}>
                        <div
                            class="slds-grid slds-wrap slds-p-horizontal_small slds-p-top_x-small"
                        >
                            <div class="slds-col slds-size_1-of-2">
                                <div
                                    class="slds-form-element slds-form-element_readonly"
                                >
                            <span class="slds-form-element__label">
                                <!--
                                  "(manual)" is NOT a caption style choice. Without it the row asserts
                                  a freshness the data does not have: the figures above were typed by
                                  hand or seeded, possibly months ago. If a real integration ever
                                  lands, this label and the helptext change in the same commit as the
                                  callout.
                                -->
                                Last Synced (manual)
                                <lightning-helptext
                                    content={helpText}
                                ></lightning-helptext>
                            </span>
                            <div class="slds-form-element__control">
                                <div class="slds-form-element__static">
                                    <template lwc:if={hasLastSynced}>
                                        <!--
                                          A plain value row via lightning-formatted-date-time — NOT a
                                          badge and NOT a coloured pill. It is a value, not a status,
                                          and nothing ages or expires it (residual R6), so any colour
                                          band would be inventing a meaning the data cannot support.
                                        -->
                                        <lightning-formatted-date-time
                                            value={lastSynced}
                                            year="numeric"
                                            month="short"
                                            day="2-digit"
                                            hour="2-digit"
                                            minute="2-digit"
                                        ></lightning-formatted-date-time>
                                    </template>
                                    <template lwc:elseif={lastSyncedPending}>
                                        <!--
                                          🔴 A record wire has not answered yet, so we do not know
                                          whether this property has ever been synced. "Never" would be
                                          an ASSERTION made before the fact is in hand — the same
                                          confident-wrong-answer defect the "Not available" state
                                          exists to prevent on the error branch, the three-state
                                          access gate exists to prevent on the button, and
                                          `showNoProperty` exists to prevent on the note above.
                                          aria-hidden because a screen reader should be told nothing
                                          here, not told a dash.
                                        -->
                                        <span
                                            class="mds-muted"
                                            aria-hidden="true"
                                            >{loadingLabel}</span
                                        >
                                    </template>
                                    <template lwc:else>
                                        <span class="mds-muted"
                                            >{emptyLastSyncedLabel}</span
                                        >
                                    </template>
                                </div>
                            </div>
                        </div>
                            </div>
                        </div>
                    </template>

                    <div
                        class="slds-grid slds-grid_align-end slds-grid_vertical-align-center slds-wrap slds-p-around_small mds-footer"
                    >
                        <!--
                          The reason is rendered BESIDE the disabled button, never instead of it.
                          Hiding the button would be indistinguishable from "this feature is not for
                          me"; leaving it live would fail at click time with a raw platform error.

                          Two known causes reach here — no linked property, and no FLS edit on the
                          stamp field. An UNKNOWN cause (object info still loading, or an object-info
                          read that failed) renders NOTHING, because naming a cause you have not
                          established sends the user after the wrong fix.
                        -->
                        <template lwc:if={showDisabledReason}>
                            <p class="mds-reason slds-p-right_small" role="note">
                                {disabledReason}
                            </p>
                        </template>
                        <lightning-button
                            variant="neutral"
                            label="Sync"
                            title={syncButtonTitle}
                            disabled={syncDisabled}
                            onclick={handleSync}
                        ></lightning-button>
                    </div>
                </template>
            </div>
        </div>
        </div>
    </template>

    <template lwc:else>
        <!--
          🔴 A misconfigured instance must SAY SO. An empty card is indistinguishable from "this deal
          has no market data", and nothing else in the org would ever report the mistake.
        -->
        <div class="slds-card slds-p-around_small mds-card">
            <p class="mds-error" role="alert">{configError}</p>
        </div>
    </template>
</template>
