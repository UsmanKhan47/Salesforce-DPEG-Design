<template>
    <template if:true={row}>
        <div class="card">
            <div class="card-header">
                <div class="header-left">
                    <div class="card-title">Disposition Closing — Stage 4</div>
                </div>
                <template if:false={row.psaExecuted}>
                    <span class="status-badge"><span class="badge-dot"></span>Not yet active for {row.assetName}</span>
                </template>
            </div>
            <div class="cards-grid">
                <template for:each={stats} for:item="stat">
                    <c-onboarding-card-child
                        key={stat.key}
                        value={stat.value}
                        label={stat.label}
                        icon-name={stat.iconName}
                        icon-color={stat.iconColor}>
                    </c-onboarding-card-child>
                </template>
            </div>
        </div>
    </template>
</template>
