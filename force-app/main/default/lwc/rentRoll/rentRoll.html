<template>
    <template lwc:if={error}>
        <div class="card summary rr-error">Rent roll could not be loaded: {errorMessage}</div>
    </template>

    <template lwc:if={isLoading}>
        <div class="card summary rr-loading"><lightning-spinner alternative-text="Loading rent roll" size="small"></lightning-spinner></div>
    </template>

    <template lwc:if={data}>
        <!-- Summary bar -->
        <div class="card summary">
            <div class="sum-flex">
                <div>
                    <div class="kpi-label">Total sq ft</div>
                    <div class="kpi-value">{summary.totalSqFt}</div>
                </div>
                <div>
                    <div class="kpi-label">Occupied</div>
                    <div class="kpi-line">
                        <span class="kpi-value occ">{summary.occupiedSqFt}</span>
                        <span class="kpi-pct occ">{summary.occupiedPct}</span>
                    </div>
                </div>
                <div>
                    <div class="kpi-label">Vacant</div>
                    <div class="kpi-line">
                        <span class="kpi-value vac">{summary.vacantSqFt}</span>
                        <span class="kpi-pct vac">{summary.vacantPct}</span>
                    </div>
                </div>
                <div>
                    <div class="kpi-label">Current monthly rent</div>
                    <div class="kpi-line">
                        <span class="kpi-value">{summary.monthlyRent}</span>
                        <span class="kpi-sub">{summary.occupiedLabel}</span>
                    </div>
                </div>
                <div class="sum-spacer"></div>
                <div class="sum-right">
                    <div class="pill">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5A5752" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        Read-only — mirrored from Yardi Voyager 7S
                    </div>
                    <div class="sync">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1A7A6B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M3 21v-5h5"></path></svg>
                        {summary.lastSynced}
                    </div>
                </div>
            </div>
            <div class="bar">
                <div class="bar-occ" style={summary.occBarStyle}></div>
                <div class="bar-vac" style={summary.vacBarStyle}></div>
            </div>
        </div>

        <!-- Units table -->
        <template lwc:if={isEmpty}>
            <div class="card summary rr-empty">No rent roll data yet — units sync from Yardi.</div>
        </template>
        <template lwc:if={hasUnits}>
            <div class="card">
                <div class="tbl-head">
                    <span class="tbl-title">Units ({unitCount})</span>
                    <span class="tbl-hint">Click a row to see its full rent step schedule</span>
                    <div class="tbl-spacer"></div>
                    <div class="legend">
                        <span class="lg"><span class="dot dot-green"></span>Lease ends &gt;12 mo</span>
                        <span class="lg"><span class="dot dot-amber"></span>6–12 mo</span>
                        <span class="lg"><span class="dot dot-red"></span>&lt;6 mo</span>
                    </div>
                </div>
                <div class="scroll">
                    <table>
                        <thead>
                            <tr>
                                <th class="sort" data-key="suite" onclick={sortBy}>{headers.suite}</th>
                                <th>Tenant</th>
                                <th class="num sort" data-key="sqft" onclick={sortBy}>{headers.sqft}</th>
                                <th class="num sort" data-key="rent" onclick={sortBy}>{headers.rent}</th>
                                <th class="num">Rent / Sq Ft</th>
                                <th class="sort" data-key="end" onclick={sortBy}>{headers.end}</th>
                                <th class="num">NNN Monthly</th>
                                <th class="chev-col"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={rows} for:item="row">
                                <tr key={row.id} class={row.rowClass} data-id={row.id} onclick={toggleRow}>
                                    <td><span class="suite">{row.suiteDisp}</span></td>
                                    <td><span class={row.tenantClass}>{row.tenantDisp}</span></td>
                                    <td class="num">{row.sqftDisp}</td>
                                    <td class="num">{row.rentDisp}</td>
                                    <td class="num"><span class={row.psfClass}>{row.psfDisp}</span></td>
                                    <td>
                                        <span class="term">
                                            {row.termDisp}
                                            <template lwc:if={row.dot}>
                                                <span class="dot" style={row.dot.style} title={row.dot.title}></span>
                                            </template>
                                        </span>
                                    </td>
                                    <td class="num">
                                        <span class={row.nnnClass} data-id={row.id} onmouseenter={tipEnter} onmouseleave={tipLeave}>{row.nnnDisp}</span>
                                    </td>
                                    <td class="chev-col">
                                        <template lwc:if={row.occupied}>
                                            <svg class="chev" style={row.chevStyle} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8680" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
                                        </template>
                                    </td>
                                </tr>
                                <template lwc:if={row.isExpanded}>
                                    <tr key={row.panelKey}>
                                        <td colspan="8" class="panel-cell">
                                            <div class="panel">
                                                <div class="chips">
                                                    <span class="panel-title">Rent step schedule — {row.panelTitle}</span>
                                                    <div class="tbl-spacer"></div>
                                                    <span class="chips-label">NNN breakdown:</span>
                                                    <span class="chip">Property Tax <b>{row.nnnTaxDisp}</b></span>
                                                    <span class="chip">Insurance <b>{row.nnnInsDisp}</b></span>
                                                    <span class="chip">CAM <b>{row.nnnCamDisp}</b></span>
                                                    <span class="chip total">Total <b>{row.nnnTotDisp}</b> · {row.nnnPsfDisp}/SF</span>
                                                </div>
                                                <div class="sched">
                                                    <table>
                                                        <thead>
                                                            <tr>
                                                                <th>Period</th>
                                                                <th class="num">Monthly Rent</th>
                                                                <th class="num">$ / Sq Ft</th>
                                                                <th class="type-col">Type</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            <template for:each={row.steps} for:item="s">
                                                                <tr key={s.key} class={s.rowClass}>
                                                                    <td class="speriod">
                                                                        {s.period}
                                                                        <template lwc:if={s.active}><span class="badge">Active now</span></template>
                                                                    </td>
                                                                    <td class="num"><span class={s.rentClass}>{s.rentDisp}</span></td>
                                                                    <td class="num spsf">{s.psfDisp}</td>
                                                                    <td class="type-col"><span class={s.tagClass}>{s.typeLabel}</span></td>
                                                                </tr>
                                                            </template>
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </template>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td class="foot-label">Totals</td>
                                <td class="foot-sub">{totals.occLabel}</td>
                                <td class="num">
                                    <div class="foot-strong">{summary.totalSqFt}</div>
                                    <div class="foot-tiny">{totals.sqftSplit}</div>
                                </td>
                                <td class="num foot-strong">{summary.monthlyRent}</td>
                                <td class="num"><span class="foot-mono">{totals.blendedPsf}</span> <span class="foot-tiny">blended</span></td>
                                <td></td>
                                <td class="num foot-strong">{totals.nnnTotal}</td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
            <div class="note">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg>
                Rent roll data is created and maintained in Yardi only. This view refreshes with the nightly sync — Salesforce never writes back.
            </div>
        </template>
    </template>

    <!-- NNN hover tooltip (fixed, escapes table clipping) -->
    <template lwc:if={tip}>
        <div class="tooltip" style={tip.style}>
            <div class="tip-head">NNN breakdown — {tip.suite}</div>
            <div class="trow"><span>Property Tax</span><span class="tmono">{tip.tax}</span></div>
            <div class="trow"><span>Insurance</span><span class="tmono">{tip.ins}</span></div>
            <div class="trow"><span>CAM</span><span class="tmono">{tip.cam}</span></div>
            <div class="trow ttotal"><span>Total · {tip.psf}/SF</span><span class="tmono">{tip.total}</span></div>
        </div>
    </template>
</template>
