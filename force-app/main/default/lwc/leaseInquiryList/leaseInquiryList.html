<template>
    <lightning-card>
        <div slot="title" class="hdr">
            <span class="hdr-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A9ED4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>
                </svg>
            </span>
            <span class="hdr-title">Recent Inquiries ({count})</span>
        </div>
        <div slot="actions" class="hdr-actions">
            <lightning-button variant="brand" label="New Inquiry" icon-name="utility:add" onclick={newInquiry}></lightning-button>
        </div>
        <template if:true={hasError}>
            <div class="wire-error" role="alert">
                <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
                <span>Recent inquiries could not be loaded: {errorMessage}</span>
            </div>
        </template>
        <template if:false={hasError}>
            <c-list-datatable
                key-field="id"
                data={rows}
                columns={columns}
                column-widths-mode="fixed"
                hide-checkbox-column>
            </c-list-datatable>
        </template>
        <div slot="footer" class="view-all-footer">
            <a href={listUrl} onclick={viewAll}>View All</a>
        </div>
    </lightning-card>
</template>
