<template>
    <template if:true={hasError}>
        <div class="wire-error" role="alert">
            <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
            <span>Lease inquiry KPIs could not be loaded: {errorMessage}</span>
        </div>
    </template>
    <template if:false={hasError}>
        <div class="kpi-grid">
            <template for:each={cards} for:item="c">
                <c-stat-card key={c.key} value={c.value} label={c.label} icon-name={c.iconName} icon-color={c.iconColor}></c-stat-card>
            </template>
        </div>
    </template>
</template>
