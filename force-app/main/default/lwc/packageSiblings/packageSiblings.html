<template>
    <!--
        Nothing renders at all unless there is a real package or a real failure. Most records in the
        org came from a single-property email, and an always-present empty card on every Lead and
        every deal is worse than no feature — see the component's class header.
    -->
    <template if:true={isVisible}>
        <lightning-card icon-name="standard:related_list">
            <span slot="title">Property Package ({count})</span>

            <template if:true={hasError}>
                <div class="lv-error slds-p-around_medium slds-text-color_error" role="alert">
                    {errorMessage}
                </div>
            </template>

            <template if:false={hasError}>
                <div class="slds-p-horizontal_medium slds-p-bottom_small">
                    <!--
                        The package heading. A real <a href> so the row is middle-clickable and
                        copyable; the click handler navigates in-app. The URL is SERVER-BUILT —
                        composing it here would need the object API name, the one thing this
                        component deliberately never learns.
                    -->
                    <p class="slds-text-body_small slds-text-color_weak ps-line">
                        From one broker email:
                        <a
                            href={packageUrl}
                            onclick={handlePackageClick}
                            title={packageName}
                        >{packageName}</a>
                    </p>
                </div>

                <template if:true={hasSiblings}>
                    <!--
                        A <ul> of links rather than a datatable: jsdom does no layout, so an
                        overflow-prone table cannot be tested for horizontal scroll, and a
                        semantic list is what a screen reader announces usefully here.
                    -->
                    <ul class="slds-has-dividers_bottom-space ps-list">
                        <template for:each={siblings} for:item="row">
                            <li key={row.id} class="slds-item ps-item">
                                <a
                                    href={row.recordUrl}
                                    data-id={row.id}
                                    onclick={handleSiblingClick}
                                    class="ps-link"
                                >{row.name}</a>
                                <span class="slds-text-body_small slds-text-color_weak ps-meta">
                                    {row.objectLabel} &middot; {row.status}
                                </span>
                            </li>
                        </template>
                    </ul>
                </template>

                <template if:false={hasSiblings}>
                    <!--
                        A package with no OTHER members. Not the common "no package" case (that
                        renders nothing at all) — this is design residual R6: a multi-property email
                        whose other properties failed to route. The package link above is how a
                        human reaches the routing audit that says where they went.
                    -->
                    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                        <p class="slds-text-body_small slds-text-color_weak">
                            No other records were created from this email.
                        </p>
                    </div>
                </template>
            </template>
        </lightning-card>
    </template>
</template>
