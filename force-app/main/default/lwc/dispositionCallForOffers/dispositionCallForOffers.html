<template>
    <lightning-card icon-name="standard:event">
        <span slot="title">Call for Offers</span>

        <!--
            ⚠ NO `slot="actions"`. A "+ Log Offer" brand button lived here and was REMOVED at UAT on
            2026-08-21 ("I asked you to remove the log offer button from call for offers lwc"). The
            dialog it opened is NOT orphaned: `c/dispositionOffer` in the SIDEBAR opens the same
            `c/dispositionLogOfferModal`, and `dispositionSidebar.isOfferStage` includes
            'Active Listing' — the only stage this card renders at — so both cards are on screen
            together and the remaining entry point is one click away.
        -->

        <template lwc:if={hasError}>
            <div class="lv-error slds-p-around_medium slds-text-color_error" role="alert">
                The call-for-offers details could not be loaded: {errorMessage}
            </div>
        </template>

        <!-- dt/dd ONLY, in order and with no wrapper divs — axe's
             `definition-list` rule is strict, so the two-up layout is CSS. -->
        <dl class="cfo-stats">
            <dt class="cfo-label">Call For Offers Date</dt>
            <dd class="cfo-value">{cfoDateLabel}</dd>
        </dl>
    </lightning-card>
</template>
