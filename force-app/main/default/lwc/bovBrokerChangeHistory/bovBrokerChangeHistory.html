<template>
    <!-- 🔴 THE CARD CHROME IS UNCONDITIONAL. Every one of the four states below renders INSIDE
         it. Before 2026-08-21 this template emitted a bare, title-less <div> — on the record
         page it read as an unlabelled sentence floating between two proper cards, which is the
         UAT complaint that produced this rework. A titled card that is briefly empty tells the
         user WHICH panel they are looking at; an untitled blob tells them nothing.
         The count is appended only once the wire has answered — see `cardTitle` in the JS. -->
    <lightning-card icon-name="standard:record_update">
        <span slot="title">{cardTitle}</span>

        <!-- ═══════════════════════════════════════════════════════════════════════════════
             DATA — A VERTICAL TIMELINE. ONE ENTRY PER RECORDED CHANGE.
             ═══════════════════════════════════════════════════════════════════════════════
             🔴 RESTYLED 2026-08-24 TO THE USER-SUPPLIED TIMELINE DESIGN. This was previously
             a self-labelling dt/dd TILE (and before that a two-column flex row). The tile's
             four <dt> labels — When / Reason / Logged by / Notes — are gone from the visible
             markup and replaced by three lines per entry:
                1. {outgoing} → {incoming}, both bold;
                2. calendar icon · date-time · pipe · reason;
                3. "Logged By:" · name.

             🔴 WHAT REPLACED THE VISIBLE LABELS IS NOT NOTHING. Removing a <dt> removes the
             accessible name of the value beside it, so each value that lost a visible label
             carries an equivalent: the date-time's label is the calendar icon's
             `alternative-text`, the reason's is a locally-defined `.bbc-sr-only` span (NOT the global
             `slds-assistive-text` — that class lives in a document-level SLDS stylesheet, and
             under NATIVE shadow DOM it would not reach into this component, leaving the word
             "Reason" visible on screen; the local rule cannot fail that way).
             The "Logged By:" label stayed visible because the design shows it. Do not delete
             the assistive spans as "dead markup" — in a 340px sidebar a bare date and a bare
             sentence are exactly as unidentifiable to a screen-reader user as they would be to
             a sighted one without the icon.

             ⚠ THE RAIL (dot + connecting line) IS PURELY DECORATIVE and is `aria-hidden`.
             It carries no information the three text lines do not already carry, and an
             announced empty <span> per entry is noise.

             ORDERING IS THE SERVER'S (Entry_DateTime__c DESC, Name DESC) and is not re-sorted
             here — see the component header.

             role="list" is NOT redundant: `list-style: none` makes WebKit drop the implicit
             list role, and aria-label is only exposed on an element whose role supports
             naming. axe has no rule for it, so a passing toBeAccessible() is not evidence
             against it.

             🔴 THE INTRO LINE ("Every broker ever appointed to this sale — nothing is deleted.")
             WAS REMOVED ON 2026-08-21 at the user's request — they quoted it. It rendered here
             AND inside the empty state, and both copies are gone, along with the `id="bbc-intro"`
             it carried and the `aria-describedby` on the list below that pointed at it. ⚠ A
             DANGLING `aria-describedby` IS WORSE THAN NONE — it names an element that does not
             exist, so do not leave the attribute behind if the paragraph ever goes again. -->
        <template lwc:if={hasRows}>
            <ul class="bbc-timeline" role="list" aria-label="Broker changes">
                <template for:each={historyRows} for:item="row">
                    <li key={row.id} class="bbc-entry">
                        <!-- Decorative only — see the note above. The dot marks the entry and
                             the track joins it to the next one; the track is suppressed on the
                             last entry in CSS so the line ends ON a dot rather than trailing
                             off into the card's padding. -->
                        <div class="bbc-rail" aria-hidden="true">
                            <span class="bbc-dot"></span>
                            <span class="bbc-track"></span>
                        </div>

                        <div class="bbc-body">
                            <!-- The swap reads left-to-right as "this became that", BOTH FIRMS
                                 BOLD (the outgoing firm is no longer struck through or greyed —
                                 the supplied design gives them equal weight). It WRAPS rather
                                 than truncating: at 340px "No Previous Broker → Marcus &
                                 Millichap" legitimately needs two lines, and a firm name clipped
                                 to an ellipsis is worse than a wrapped one.
                                 ⚠ The arrow is a GLYPH, aria-hidden, with the relationship
                                 spelled out in assistive text beside it — screen readers vary on
                                 whether they announce "→" at all, and "JLL Cushman & Wakefield"
                                 with no verb between them is not a broker change. -->
                            <h3 class="bbc-swap slds-hyphenate">
                                <span class="bbc-outgoing">{row.outgoing}</span>
                                <span class="bbc-arrow" aria-hidden="true">→</span>
                                <span class="bbc-sr-only">replaced by</span>
                                <span class="bbc-incoming">{row.incoming}</span>
                            </h3>

                            <!-- Line 2: when · | · why. The pipe is decorative and is rendered
                                 ONLY when there is a reason to separate the date from — a
                                 dangling "Aug 21, 2026, 10:09 PM |" is a visible promise of a
                                 value that does not exist. Same principle as the omitted dt/dd
                                 pairs this replaced: an absent reason and a blank reason look
                                 identical on screen and mean different things. -->
                            <p class="bbc-meta">
                                <lightning-icon
                                    icon-name="utility:event"
                                    size="xx-small"
                                    class="bbc-meta-icon"
                                    alternative-text="Changed on"
                                ></lightning-icon>
                                <span class="bbc-when bbc-mono">
                                    <lightning-formatted-date-time
                                        value={row.entryDateTime}
                                        year="numeric"
                                        month="short"
                                        day="2-digit"
                                        hour="2-digit"
                                        minute="2-digit"
                                    ></lightning-formatted-date-time>
                                </span>
                                <template lwc:if={row.hasReason}>
                                    <span class="bbc-sep" aria-hidden="true">|</span>
                                    <span class="bbc-sr-only">Reason</span>
                                    <span class="bbc-reason">{row.reason}</span>
                                </template>
                            </p>

                            <!-- Line 3. The label is MUTED and VISIBLE, the name is normal
                                 weight — per the supplied design, and the one label that did
                                 not become assistive-only. -->
                            <template lwc:if={row.hasLoggedBy}>
                                <p class="bbc-logged">
                                    <span class="bbc-logged-label">Logged By:</span>
                                    <span class="bbc-loggedby">{row.loggedBy}</span>
                                </p>
                            </template>

                            <!-- 🔴 THE NOTES AFFORDANCE IS DELIBERATELY RETAINED THOUGH THE
                                 SUPPLIED DESIGN DOES NOT SHOW IT. Notes are captured by
                                 c/bovReplaceBrokerModal and stored on Notes__c; this is the only
                                 place in the application that reads them back. Dropping the line
                                 to match a three-line mock would silently retire a working
                                 feature and orphan the data.
                                 It is surfaced as a FOURTH, quieter line: a note icon (which is
                                 also the line's accessible name, since the "Notes" <dt> is gone)
                                 + the same 60-character preview + the same View button, opening
                                 the same modal. Behaviour is byte-for-byte what it was; only the
                                 label mechanism changed. -->
                            <template lwc:if={row.hasNotes}>
                                <p class={row.notesClass}>
                                    <lightning-icon
                                        icon-name="utility:note"
                                        size="xx-small"
                                        class="bbc-meta-icon"
                                        alternative-text="Notes"
                                    ></lightning-icon>
                                    <span class="bbc-notes-txt">{row.notesPreview}</span>
                                    <template lwc:if={row.notesLong}>
                                        <button
                                            class="bbc-notes-view"
                                            data-id={row.id}
                                            onclick={openNote}
                                            title="View full note"
                                        >
                                            View
                                        </button>
                                    </template>
                                </p>
                            </template>
                        </div>
                    </li>
                </template>
            </ul>
        </template>

        <!-- ═══════════════════════════════════════════════════════════════════════════════
             🔴 EMPTY. THE MAJORITY STATE OF THIS CARD.
             ═══════════════════════════════════════════════════════════════════════════════
             Most dispositions never replace a broker, so this is what most disposition record
             pages in the org will render. It is a STATUS, never an alert and never a spinner.

             🔴 THE SENTENCE ITSELF IS THE EMPTY STATE, AND IT STAYS. "No broker changes recorded"
             is what separates EMPTY from LOADING from UNAVAILABLE, and the icon + role="status"
             are what stop it reading as an error. The 2026-08-21 prose removal took the
             explanatory SUB-LINE ("Every broker ever appointed to this sale — nothing is
             deleted.") and nothing else — the user named that string specifically. Do not delete
             the heading with it. -->
        <template lwc:if={isEmpty}>
            <div class="bbc-state" role="status">
                <lightning-icon
                    icon-name="utility:change_record_type"
                    size="small"
                    class="bbc-state-icon"
                ></lightning-icon>
                <p class="bbc-empty">No broker changes recorded</p>
            </div>
        </template>

        <!-- ═══════════════════════════════════════════════════════════════════════════════
             UNAVAILABLE. A THIRD STATE, NOT A FLAVOUR OF EMPTY.
             ═══════════════════════════════════════════════════════════════════════════════
             Same neutral, centred treatment as the empty state above and deliberately NOT the
             shared `.lv-error` look used elsewhere in this repo: a secondary informational card
             cannot read the situation well enough to raise an alarm, and the realistic cause is
             a missing FLS grant, which is an administrator's problem rather than this user's
             emergency. The wording is what separates the two states, plus the italics.
             ⚠ THIS STATE ALREADY EXCLUDED THE INTRO SENTENCE BEFORE 2026-08-21 REMOVED IT
             EVERYWHERE, and for a reason worth keeping: "Every broker ever appointed to this sale"
             was a COMPLETENESS CLAIM, and this is precisely the state in which the card cannot
             make one. If any explanatory line is ever added back to the empty state, it must
             still not appear here. -->
        <template lwc:if={isUnavailable}>
            <div class="bbc-state" role="status">
                <lightning-icon
                    icon-name="utility:info"
                    size="small"
                    class="bbc-state-icon"
                ></lightning-icon>
                <p class="bbc-unavailable">{unavailableText}</p>
            </div>
        </template>
    </lightning-card>

    <!-- Full-note popup. Left as a hand-rolled SLDS modal rather than migrated to
         lightning/modal: it displays text this component already holds, opens and closes
         entirely within one component, and returns nothing to a caller — none of which is what
         LightningModal exists for (contrast c/bovReplaceBrokerModal and c/bovAddResponseModal,
         which both resolve a value back to their opener). -->
    <template lwc:if={showNoteModal}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="bbc-note-heading"
            class="slds-modal slds-fade-in-open"
        >
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button
                        class="slds-button slds-button_icon slds-modal__close bbc-note-close"
                        title="Close"
                        onclick={closeNote}
                    >
                        <lightning-icon
                            icon-name="utility:close"
                            size="small"
                            variant="inverse"
                            alternative-text="Close"
                        ></lightning-icon>
                    </button>
                    <h2 id="bbc-note-heading" class="slds-modal__title slds-hyphenate">
                        Notes
                    </h2>
                    <p class="bbc-note-sub">{noteSubtitle}</p>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p class="bbc-note-full">{noteText}</p>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_brand" onclick={closeNote}>
                        Close
                    </button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
