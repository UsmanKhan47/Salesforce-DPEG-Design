<template>
    <div class="bbc-card">
        <div class="bbc-body">
            <div class="bbc-intro">{intro}</div>

            <!-- ROWS. Ordering is the SERVER's (Entry_DateTime__c DESC, Name DESC) and is not
                 re-sorted here — see the component header. -->
            <template lwc:if={hasRows}>
                <template for:each={historyRows} for:item="row">
                    <div key={row.id} class="bbc-row">
                        <div class="bbc-left">
                            <div class="bbc-swap">
                                <span class="bbc-outgoing">{row.outgoing}</span>
                                <lightning-icon
                                    icon-name="utility:forward"
                                    size="xx-small"
                                    class="bbc-arrow"
                                    alternative-text="replaced by"
                                ></lightning-icon>
                                <span class="bbc-incoming">{row.incoming}</span>
                            </div>
                            <template lwc:if={row.hasNotes}>
                                <div class={row.notesClass}>
                                    <span class="bbc-notes-lbl">Notes:</span>
                                    <span class="bbc-notes-txt">{row.notesPreview}</span>
                                    <template lwc:if={row.notesLong}>
                                        <button
                                            class="bbc-notes-view"
                                            data-id={row.id}
                                            onclick={openNote}
                                            title="View full note"
                                        >
                                            View
                                        </button>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <div class="bbc-right">
                            <div class="bbc-mono bbc-when">
                                <lightning-formatted-date-time
                                    value={row.entryDateTime}
                                    year="numeric"
                                    month="short"
                                    day="2-digit"
                                    hour="2-digit"
                                    minute="2-digit"
                                ></lightning-formatted-date-time>
                            </div>
                            <template lwc:if={row.hasReason}>
                                <div class="bbc-reason">{row.reasonDisp}</div>
                            </template>
                            <template lwc:if={row.hasLoggedBy}>
                                <div class="bbc-loggedby">{row.loggedByDisp}</div>
                            </template>
                        </div>
                    </div>
                </template>
            </template>

            <!-- 🔴 EMPTY. The MAJORITY state of this card. A plain sentence — never an alert,
                 never a spinner. -->
            <template lwc:if={isEmpty}>
                <div class="bbc-empty">No broker changes recorded</div>
            </template>

            <!-- UNAVAILABLE. A THIRD state, muted rather than alarming, and deliberately NOT
                 worded like the empty state — see the component header. -->
            <template lwc:if={isUnavailable}>
                <div class="bbc-unavailable">{unavailableText}</div>
            </template>
        </div>
    </div>

    <!-- Full-note popup -->
    <template lwc:if={showNoteModal}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="bbc-note-heading"
            class="slds-modal slds-fade-in-open"
        >
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button
                        class="slds-button slds-button_icon slds-modal__close bbc-note-close"
                        title="Close"
                        onclick={closeNote}
                    >
                        <lightning-icon
                            icon-name="utility:close"
                            size="small"
                            variant="inverse"
                            alternative-text="Close"
                        ></lightning-icon>
                    </button>
                    <h2 id="bbc-note-heading" class="slds-modal__title slds-hyphenate">
                        Notes
                    </h2>
                    <p class="bbc-note-sub">{noteSubtitle}</p>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p class="bbc-note-full">{noteText}</p>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_brand" onclick={closeNote}>
                        Close
                    </button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
